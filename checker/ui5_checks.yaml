# CAP·UI5 개발 표준(conventions/cap-ui5.md)의 기계 검사 규칙 목록. 데이터로 둔다(CLAUDE.md 원칙 2).
#
# 여기 있는 것은 "어떤 규칙이 있고 기본 심각도가 무엇인가" 뿐이다. 무엇이 위반인지는 코드(checker/ui5_rules.py)가 판정한다.
# 프로젝트는 conventions/cap-ui5.yaml 의 `규칙:` 으로 규칙별 심각도(violation·warn·off)를 바꿀 수 있다.
# level: violation 은 검사를 실패시키고, warn 은 알리기만 한다(종료코드를 바꾸지 않는다).
# 규칙 id 가 코드와 이 파일에서 하나라도 어긋나면 검사 불능이다(엔진 설정 오류).
#
# targets 는 검사 대상 파일 종류다.
#   js         **/webapp/**/*.js (UI5 앱 JS. CAP srv/ 의 JS 는 대상이 아니다)
#   xml        *.view.xml, *.fragment.xml (abapGit 메타 .xml 은 대상이 아니다)
#   properties **/i18n/*.properties

rules:
  UI5-001:
    title: "console.* 를 쓰지 않는다"
    level: violation
    targets: js
    fix: "sap.base.Log 의 info/debug/warning/error 를 쓴다."
  UI5-002:
    title: "값 비교에 == / != 를 쓰지 않는다"
    level: violation
    targets: js
    fix: "=== 와 !== 를 쓴다."
  UI5-003:
    title: "Control ID 에 하이픈을 쓰지 않는다"
    level: violation
    targets: xml
    fix: "하이픈 없는 lowerCamelCase 로 바꾼다. 하이픈은 UI5 가 ID 를 합칠 때 쓰는 구분자다."
  UI5-004:
    title: "화면 XML 속성에 한글을 직접 쓰지 않는다"
    level: violation
    targets: xml
    fix: "문구를 i18n properties 에 넣고 {i18n>키} 로 쓴다."
  UI5-101:
    title: "icon 속성은 sap-icon:// 로 쓴다"
    level: warn
    targets: xml
    fix: "sap-icon://아이콘이름 으로 쓴다. 그림 파일을 쓸 때는 URL 이나 경로를 쓴다."
  UI5-102:
    title: "자기 닫힘 /> 앞에 공백을 두지 않는다"
    level: warn
    targets: xml
    fix: "/> 앞의 공백을 지운다."
  UI5-103:
    title: "DOM 을 직접 찾지 않는다(document.getElementById, querySelector)"
    level: warn
    targets: js
    fix: "this.byId() 같은 UI5 API 로 Control 을 가져온다. DOM 이 꼭 필요하면 jQuery(window.document.getElementById(sId)) 로 감싼다."
  UI5-104:
    title: "UI5 의 private(_ 로 시작하는) 멤버를 쓰지 않는다"
    level: warn
    targets: js
    fix: "공개 API 로 바꾼다. 이 파일 안에서 정의한 이름이면 무시해도 된다."
  UI5-105:
    title: "들여쓰기는 탭으로 한다"
    level: warn
    targets: js
    fix: "줄 앞의 공백을 탭으로 바꾼다. 파일 안의 기존 줄이 공백이면 그 방식을 따른다."
  UI5-106:
    title: "지역변수 이름은 자료형 접두어(s o $ i m a d f b r fn v p)로 시작한다"
    level: warn
    targets: js
    fix: "sId, oData, aRows 처럼 접두어 + 대문자로 시작하는 이름으로 바꾼다."
  UI5-108:
    title: "i18n 키는 [화면].[Type].[key] 형식으로 쓴다"
    level: warn
    targets: properties
    fix: "main.label.empNm 처럼 소문자로 시작하는 세 칸을 점으로 잇는다."
  UI5-109:
    title: "i18n 문구 윗줄에 텍스트 종류 주석(#XBUT 등)을 단다"
    level: warn
    targets: properties
    fix: "키 바로 위 줄에 #XBUT, #XFLD, #XTIT, #XMSG 같은 주석을 단다."
  UI5-110:
    title: "i18n 한글 메시지를 ~세요. / ~주시오. 로 끝내지 않는다"
    level: warn
    targets: properties
    fix: "~바랍니다. / ~십시오. / ~하시겠습니까? 같은 존칭 종결어로 끝낸다."
