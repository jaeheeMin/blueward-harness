# 공통 개발 규칙(CR-001, CR-002)의 기계 검사 설정. 데이터로 둔다(CLAUDE.md 원칙 2).
#
# 여기 있는 것은 "어느 언어에서 어느 규칙을 적용하는가" 뿐이다. 언어마다 주석과
# 문자열을 어떻게 알아보는지, 반복문을 어떻게 알아보는지는 코드(checker/code_rules.py)다.
# 언어나 규칙이 늘 때 이 파일만 고치면 되게 하는 것이 목표다.

languages:
  abap:
    # ABAP 리포트·클래스·인클루드. 확장자는 프로젝트마다 다를 수 있지만 우선 이것부터.
    suffixes: [".abap"]
  js:
    # CAP(Cloud Application Programming) 서비스 구현 등 JS/TS.
    suffixes: [".js", ".ts", ".mjs", ".cjs"]
  cds:
    # CDS(Core Data Services) 정의.
    suffixes: [".cds"]
  bdef:
    # RAP 동작 정의(Behavior Definition). abapGit 형식(`<name>.bdef.asbdef`)의
    # 확장자는 `.asbdef` 다(#72). 반복문 개념이 없어 CR-002 대상이 아니다.
    suffixes: [".asbdef"]

rules:
  CR-001:
    title: "이름에 한글을 쓰지 않는다"
    languages: [abap, js, cds, bdef]
    fix: "영문 이름으로 바꾼다. 주석과 문자열은 그대로 둬도 된다."
  CR-002:
    title: "반복문 안에서 DB 를 조회하지 않는다"
    languages: [abap, js]
    fix: "반복문 밖에서 한 번에 모아 조회한다 — FOR ALL ENTRIES / JOIN / IN, ABAP Cloud 는 CDS view."
  CR-003:
    # CDS 는 넣지 않았다. `select from x { * }` 같은 필드 목록 와일드카드 문법이
    # CDS 에도 있는지, 있다면 어떤 모양인지가 불확실해 넣으면 오탐(과검출)이나
    # 놓침(과소검출) 중 어느 쪽으로도 잘못될 위험이 있다. 확실한 ABAP 부터 먼저
    # 넣고, CDS 는 실제 문법을 확인한 뒤 별도로 다룬다(이슈 #81 보고 참고).
    title: "SELECT * 대신 필요한 필드만 조회한다"
    languages: [abap]
    fix: "필요한 필드만 나열한다(옛 문법은 필드 목록, 새 문법은 FIELDS 절). COUNT( * ) 는 그대로 둬도 된다."
  CR-007:
    title: "오류를 조용히 삼키지 않는다(빈 CATCH 를 두지 않는다)"
    languages: [abap, js]
    fix: "예외를 기록하거나 사용자에게 알린다. 정말 무시해도 된다면 harness:allow 로 이유를 남긴다."
