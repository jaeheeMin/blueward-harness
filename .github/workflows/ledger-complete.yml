# Project Repository 가 가져다 쓰는 재사용 워크플로(#346).
#
# main 에 PR 이 병합되면 진행 원장(audit/ledger/*.md)의 개발 건 상태를 `완료`, 마지막 PR 을
# `#<PR번호>` 로 바꿔 main 에 직접 커밋·push 한다. 추가 PR 을 만들지 않는다. 손으로 바꾸면
# main 직접 커밋 금지 때문에 PR 이 하나 더 생기기 때문이다.
#
# 대상은 병합된 PR 본문의 `Closes|Fixes|Resolves #N` 이 가리키는 이슈 중 제목이 `[DEV-xxx]` 로
# 시작하는 대표 이슈뿐이다. 하위 작업 이슈(`... (DEV-xxx)`)만 닫았거나 대표 이슈를 닫지 않은 PR 은
# 원장을 그대로 둔다 — 그때는 사람이 바꾼다. 판정은 `checker.ledger_complete` 에 있다.
#
# 판정 불능(gh 호출 실패, 원장에 그 ID 행이 없거나 둘 이상, 표 형식을 못 읽음)은 통과도 위반도
# 아니다(CLAUDE.md 원칙 7). 아무것도 바꾸지 않고 job 을 실패시키며, 이슈를 열어 "원장을 손으로 고쳐
# 달라" 고 알린다. push 가 5번 다 실패해도 같다(그 사이 main 이 계속 움직였거나 push 권한이 막힌 것).
#
# 재시도: 시도마다 origin/main 으로 맞추고 다시 계산해 push 한다(최대 5번, 사이에 1~5초 랜덤 대기). 연달아
# 병합돼 push 가 밀려도 다음 시도가 이긴다. `concurrency` 로 줄 세우지 않는다 — 대기 중인 실행이 새 실행에
# 밀려 조용히 취소되면 그 병합의 완료 표시가 빠진다. 한 push 에 커밋이 여럿이면(`github.event.before..sha`)
# 모든 커밋의 병합 PR 을 한 번에 처리하므로, 어느 실행이 먼저 끝나도 누락이 없다. 루프는
# scripts/ledger_complete_loop.sh 에 있다(시험이 실제 git 저장소에서 돌려 본다).
#
# GITHUB_TOKEN 의 push 는 다른 워크플로를 다시 부르지 않지만, deploy key(아래) 로 push 하면 main push
# 워크플로(main-checks, 이 워크플로)가 한 번 더 돈다. 그래서 엔진이 처리 대상 커밋 중 제목이
# `docs: 진행 원장 완료 표시` 인 것(이 워크플로가 만든 커밋)은 건너뛰어 되풀이를 막는다.
# `commits/{sha}/pulls` 가 비어 오면 squash 병합 제목 끝의 `(#N)` 으로 PR 을 직접 조회한다.
#
# main 을 ruleset 으로 잠그면(PR 필수) GITHUB_TOKEN push 가 막히고, github-actions 는 ruleset bypass 에
# 넣을 수 없다. 그래서 쓰기 권한 deploy key 를 만들어 ruleset bypass 에 DeployKey 를 넣고, 비밀키를
# LEDGER_DEPLOY_KEY secret 으로 넘긴다(#445). 비어 있으면 checkout 이 토큰을 그대로 쓴다.
#   1. ssh-keygen -t ed25519 -N "" -f ledger_key
#   2. ledger_key.pub 을 저장소 Settings → Deploy keys 에 "Allow write access" 로 등록
#   3. ledger_key 를 Actions secret LEDGER_DEPLOY_KEY 로 등록
#   4. main ruleset 의 bypass list 에 Deploy keys 추가
#
# 문서 저장소 쪽에서는 이렇게 부른다. 이 워크플로 자체는 권한을 선언하지 않으므로(재사용 워크플로
# 관행) 부르는 쪽이 아래를 명시해야 한다.
#
#   on:
#     push:
#       branches: [main]
#   jobs:
#     ledger-complete:
#       uses: jaeheeMin/blueward-harness/.github/workflows/ledger-complete.yml@stable
#       permissions:
#         contents: write
#         pull-requests: read
#         issues: write
#       secrets:
#         LEDGER_DEPLOY_KEY: ${{ secrets.LEDGER_DEPLOY_KEY }}

name: ledger-complete

on:
  workflow_call:
    inputs:
      engine-ref:
        description: 판정 로직을 가져올 blueward-harness 의 ref
        type: string
        default: stable
    secrets:
      LEDGER_DEPLOY_KEY:
        required: false
        description: main ruleset bypass 에 등록한 쓰기 권한 deploy key 의 비밀키. 없으면 GITHUB_TOKEN 으로 push 한다

jobs:
  complete:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
      issues: write
    steps:
      # Project Repository 를 먼저 받는다. checkout 은 작업 폴더의 추적 안 되는 파일을 지우므로
      # 엔진(.harness-engine)을 그 뒤에 받는다.
      - name: Project Repository 받기
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          ssh-key: ${{ secrets.LEDGER_DEPLOY_KEY }}

      - name: 판정 엔진 가져오기
        uses: actions/checkout@v4
        with:
          repository: jaeheeMin/blueward-harness
          ref: ${{ inputs.engine-ref }}
          path: .harness-engine

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 진행 원장 완료 표시
        id: complete
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          BEFORE: ${{ github.event.before }}
        run: bash .harness-engine/scripts/ledger_complete_loop.sh

      - name: 못 했으면 이슈를 연다
        if: always() && steps.complete.outputs.outcome != 'done'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          title="ledger-complete: 진행 원장 완료 표시를 못 했다"
          reason="$(cat reason.txt 2>/dev/null || echo "사유를 남기지 못했다")"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body="$(printf '%s\n' \
            "main 에 병합된 커밋 ${GITHUB_SHA} 의 진행 원장 완료 표시를 하지 못했다." \
            "" \
            "- 실행: ${run_url}" \
            "- 사유: ${reason}" \
            "" \
            "원장(audit/ledger/*.md)을 손으로 고쳐 달라. 해당 개발 건의 상태를 \`완료\`, 마지막 PR 을 병합한 PR 번호로 바꾸면 된다. 아무 파일도 바꾸지 않았다.")"

          # 같은 제목의 열린 이슈가 있으면 새로 만들지 않고 코멘트만 단다.
          number="$(gh issue list --state open --limit 500 --json number,title \
            | jq -r --arg t "$title" '[.[] | select(.title == $t)][0].number // empty')"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

      - name: 판정
        if: always() && steps.complete.outputs.outcome != 'done'
        shell: bash
        run: |
          echo "::error title=진행 원장 완료 표시 실패::$(cat reason.txt 2>/dev/null || echo "사유를 남기지 못했다")"
          exit 1
