# Project Repository 가 가져다 쓰는 재사용 워크플로(#346, #445).
#
# main 에 PR 이 병합되면, 그 PR 이 대표 `[DEV-xxx]` 이슈를 `Closes|Fixes|Resolves` 했는데 진행
# 원장(audit/ledger/*.md)의 그 행이 `완료` 가 아니면 이슈를 연다. 완료면 아무것도 하지 않는다.
# **원장을 쓰지 않는 검사기다.** 원장 `완료` 와 마지막 PR 은 `/harness:deliver` 가 대표 이슈를 닫는 PR 에 처음부터
# 담아 PR 과 함께 병합된다(병합 안 되면 main 원장은 그대로다). 하위 작업 이슈(`... (DEV-xxx)`)만 닫았거나 대표
# 이슈를 안 닫은 PR 은 대상이 아니다 — 그때 `완료` 는 사람이 쓴다.
#
# 왜 쓰기를 뺐나(#445): main 에 보호 규칙(ruleset, PR 필수)을 켜면 이 워크플로가 GITHUB_TOKEN 으로 main 에
# 직접 push 하던 길이 막힌다. github-actions 는 bypass 에 넣을 수 없고, 쓰기 권한 deploy key 를 bypass 에 넣어
# secret 으로 넘기면 쓰기 권한이 있는 팀원이 브랜치 push 워크플로로 그 secret 을 읽어 main 을 우회할 수 있다.
# 그래서 push 를 없애고 PR 안에서 원장을 완료로 만든다. 재시도 루프(push 경합)도 필요 없어졌다.
#
# 판정 불능(gh 호출 실패, 원장에 그 ID 행이 없거나 둘 이상, 표 형식을 못 읽음)은 통과도 위반도 아니다(CLAUDE.md
# 원칙 7). job 을 실패시키고 이슈를 열어 "원장을 확인해 달라" 고 알린다. 완료가 아닌 행이 있는 위반도 이슈를 열고
# job 을 실패시킨다. 한 push 에 커밋이 여럿이면(`github.event.before..sha`) 모든 커밋의 병합 PR 을 본다.
# `commits/{sha}/pulls` 가 비어 오면 squash 병합 제목 끝의 `(#N)` 으로 PR 을 직접 조회한다. 판정은
# `checker.ledger_complete` 에 있다.
#
# 문서 저장소 쪽에서는 이렇게 부른다. 이 워크플로 자체는 권한을 선언하지 않으므로(재사용 워크플로
# 관행) 부르는 쪽이 아래를 명시해야 한다. 예전 caller 가 `contents: write` 를 줘도 이 워크플로는 쓰지
# 않는다(읽기로 줄이는 것이 맞다).
#
#   on:
#     push:
#       branches: [main]
#   jobs:
#     ledger-complete:
#       uses: jaeheeMin/blueward-harness/.github/workflows/ledger-complete.yml@stable
#       permissions:
#         contents: read
#         pull-requests: read
#         issues: write

name: ledger-complete

on:
  workflow_call:
    inputs:
      engine-ref:
        description: 판정 로직을 가져올 blueward-harness 의 ref
        type: string
        default: stable

jobs:
  complete:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: write
    steps:
      # Project Repository 를 먼저 받는다. checkout 은 작업 폴더의 추적 안 되는 파일을 지우므로
      # 엔진(.harness-engine)을 그 뒤에 받는다.
      - name: Project Repository 받기
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: 판정 엔진 가져오기
        uses: actions/checkout@v5
        with:
          repository: jaeheeMin/blueward-harness
          ref: ${{ inputs.engine-ref }}
          path: .harness-engine

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: 진행 원장 완료 확인
        id: complete
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          set +e
          uv run --project .harness-engine python .harness-engine/scripts/ledger_complete.py check \
            --repo "$REPO" --sha "$SHA" --before "$BEFORE" --root . > result.json 2> error.txt
          code=$?
          cat error.txt >&2
          cat result.json
          status="$(jq -r '.status // empty' result.json 2>/dev/null)"
          reason="$(jq -r '.reason // empty' result.json 2>/dev/null)"
          outcome=failed
          if [ "$code" = "0" ] && { [ "$status" = "ok" ] || [ "$status" = "skipped" ]; }; then
            outcome=ok
          elif [ -z "$reason" ]; then
            # 종료 0 인데 출력을 못 읽거나 알 수 없는 종료코드면 통과로 넘기지 않는다(검사 불능).
            reason="ledger_complete.py 가 종료코드 $code 로 끝났고 출력을 읽지 못했다: $(head -c 500 error.txt)"
          fi
          printf '%s' "$reason" > reason.txt
          echo "outcome=$outcome"
          echo "outcome=$outcome" >> "$GITHUB_OUTPUT"

      - name: 완료가 아니거나 못 봤으면 이슈를 연다
        if: always() && steps.complete.outputs.outcome != 'ok'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          title="ledger-complete: 진행 원장이 완료로 표시돼 있지 않다"
          # 확인 단계까지 가지 못했으면(checkout·엔진 준비 실패, 취소) 원장 문제가 아니라 검사 불능이다.
          reason="$(cat reason.txt 2>/dev/null || echo "확인 단계 전에 실패했다(checkout·엔진 준비 실패 또는 취소). 원장 문제인지 알 수 없다")"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body="$(printf '%s\n' \
            "main 에 병합된 커밋 ${GITHUB_SHA} 의 진행 원장 완료 여부를 확인하지 못했거나 완료가 아니다." \
            "" \
            "- 실행: ${run_url}" \
            "- 사유: ${reason}" \
            "" \
            "원장(audit/ledger/*.md)을 PR 로 고쳐 달라. 해당 개발 건의 상태를 \`완료\`, 마지막 PR 을 병합한 PR 번호로 바꾸면 된다. 이 워크플로는 원장을 쓰지 않는다.")"

          # 같은 제목의 열린 이슈가 있으면 새로 만들지 않고 코멘트만 단다.
          number="$(gh issue list --state open --limit 500 --json number,title \
            | jq -r --arg t "$title" '[.[] | select(.title == $t)][0].number // empty')"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

      - name: 판정
        if: always() && steps.complete.outputs.outcome != 'ok'
        shell: bash
        run: |
          # 사유에 섞인 줄바꿈이 워크플로 명령으로 읽히지 않게 한 줄로 편다.
          echo "::error title=진행 원장 완료 확인 실패::$(cat reason.txt 2>/dev/null | tr '\r\n' '  ' || echo "확인 단계 전에 실패했다")"
          exit 1
