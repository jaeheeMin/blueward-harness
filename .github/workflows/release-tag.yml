# 배포되는 파일이 main 에 들어오면 엔진 판 태그를 붙이고 stable 을 옮긴다(#149).
#
# 두 곳이 이 태그를 쓴다.
#   - 팀원 PC 훅: 엔진을 plugin.json version 과 같은 태그 v{version} 으로 받는다
#     (`plugins/harness/hooks/engine_spec.py`). 플러그인과 엔진이 한 짝으로 움직인다.
#   - Project Repository 의 caller workflow: 움직이는 태그 `stable` 을 부른다(`@stable`,
#     엔진 입력 `engine-ref` 기본값도 stable). main 에 방금 들어온 변경이 모든 고객사 PR 검사에
#     즉시 번지지 않고, 이 워크플로가 stable 을 옮긴 뒤에야 퍼진다.
#
# 사람이 따로 배포를 지시하지 않는다. version 을 올린 PR 이 병합되면 이 워크플로가 돈다.
#
# 돌 조건(paths). PR 검사(`checker/plugin_version.py`)가 version 을 올리라고 요구하는 파일과
# 같은 범위다: plugins/harness/ 전부, 엔진 checker/(시험 checker/tests/ 와 안의 *.md 제외),
# pyproject.toml, uv.lock, scripts/, 그리고 Project Repository 가 부르는 재사용 워크플로
# (workflow_call 을 가진 파일. 새로 생기면 아래 목록에 더한다 — 시험이 어긋남을 잡는다).
# version 을 안 올리고 병합했다면 같은 v{version} 태그가 다른 커밋에 이미 있으므로 아래에서 실패한다.
#
# 실패하거나 건너뛰면 조용히 넘어가지 않는다(CLAUDE.md 원칙 7). 아래 알림 단계가 저장소 owner 를
# 담당자로 이슈를 만든다(열린 알림 이슈가 있으면 코멘트만 남긴다).
#   - version 을 읽지 못하거나 `0.10.17` 같은 모양이 아니다.
#   - 같은 v{version} 태그가 이미 다른 커밋에 있다: version 을 올리지 않고 병합한 것이다.
#     태그는 한 번 붙으면 옮기지 않는다(받아 간 PC 의 캐시와 어긋나지 않게).
#   - stable 이 이 커밋의 조상이 아니라 옮기지 않고 건너뛴다(더 새로운 실행이 이미 옮겼을 수 있다).
#
# 이번 실행에서 새 v{version} 태그를 하나 이상 붙였으면 Teams 로 알린다(#272). 팀원 PC 훅은 플러그인을
# 갱신해야 새 판을 쓰므로, 그 사이 PC 훅과 PR 검사 결과가 다를 수 있음을 알려 갱신을 부른다.
# secret `TEAMS_PLUGIN_ALERT_WEBHOOK` 이 비면 건너뛰고, 알림이 실패해도 경고만 남기며 태그 결과를 바꾸지 않는다.
#
# 실행이 겹쳐 중간 판의 실행이 밀려나도(아래 concurrency 는 대기 중인 실행을 최신 하나로 바꾼다),
# 다음 실행이 "직전 stable 이후 main 이력에서 plugin.json 이 바뀐 커밋" 중 태그 없는 version 을
# 각각 그 커밋에 붙인다. 그래도 빠졌다면 workflow_dispatch 로 보충한다(issue-and-release.md).
name: release-tag

on:
  push:
    branches: [main]
    paths:
      - plugins/harness/**
      - checker/**
      - '!checker/tests/**'
      - '!checker/**/*.md'
      - pyproject.toml
      - uv.lock
      - scripts/**
      - .github/workflows/ai-review.yml
      - .github/workflows/doc-guard.yml
      - .github/workflows/gitleaks.yml
      - .github/workflows/ledger-complete.yml
      - .github/workflows/pr-tamper-alert.yml
      - .github/workflows/risk-gate.yml
      - .github/workflows/ssot-approval.yml
  workflow_dispatch:

# 태그 push 에 contents: write, 실패 알림 이슈에 issues: write. 그 밖의 권한은 주지 않는다.
permissions:
  contents: write
  issues: write

# 두 실행이 겹쳐 stable 을 서로 덮어쓰지 않게 줄 세운다. 진행 중인 실행은 끊지 않는다.
concurrency:
  group: release-tag
  cancel-in-progress: false

jobs:
  tag:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 태그 비교와 조상 확인에 전체 이력과 태그가 필요하다.
          fetch-depth: 0

      - name: 버전 태그를 붙이고 stable 을 옮기기
        id: tag
        shell: bash
        run: |
          set -euo pipefail

          out="${GITHUB_OUTPUT:-/dev/null}"
          pj="plugins/harness/.claude-plugin/plugin.json"
          re='^[0-9]+(\.[0-9]+)*$'

          # 알림 단계가 읽도록 사유를 남긴다. 한 줄이어야 한다.
          problem() {
            echo "::error::$1"
            printf 'problem=%s\n' "$1" >> "$out"
          }

          # 이번 실행이 새로 붙인 태그(공백으로 구분). 알림 단계가 읽는다. 붙일 때마다 다시 쓴다(마지막 값이 남는다).
          tagged=""
          mark_tagged() {
            tagged="${tagged:+$tagged }$1"
            printf 'tagged=%s\n' "$tagged" >> "$out"
          }

          version_at() {
            git show "$1:$pj" | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])'
          }

          # 원격의 태그를 최신으로 맞춘다(다른 실행이 방금 붙였을 수 있다).
          git fetch --force --tags origin

          version=""
          if ! version="$(version_at "$GITHUB_SHA")" || ! [[ "$version" =~ $re ]]; then
            problem "plugin.json 의 version 을 읽지 못했거나 0.10.17 같은 모양이 아니다(${version:-읽기 실패}). 태그를 붙이지 못했다. 다음: version 을 고쳐 다시 병합하라."
            exit 1
          fi
          tag="v$version"

          # 중간 판 보충: 직전 stable 이후 main 이력에서 plugin.json 이 바뀐 커밋 중 태그 없는 version 을 그 커밋에 붙인다.
          # stable 이 없거나 이 커밋의 조상이 아니면 이력을 알 수 없으므로 하지 않는다(전체 이력을 태깅하지 않는다).
          if stable_sha="$(git rev-parse -q --verify "refs/tags/stable^{commit}")" && git merge-base --is-ancestor "$stable_sha" "$GITHUB_SHA"; then
            for c in $(git log --first-parent --reverse --format=%H "$stable_sha..$GITHUB_SHA" -- "$pj"); do
              [ "$c" = "$GITHUB_SHA" ] && continue
              v="$(version_at "$c" 2>/dev/null)" || continue
              [[ "$v" =~ $re ]] || continue
              if ! git rev-parse -q --verify "refs/tags/v$v" > /dev/null; then
                git tag "v$v" "$c"
                git push origin "refs/tags/v$v"
                mark_tagged "v$v"
                echo "중간 판 v$v 를 $c 에 붙였다."
              fi
            done
          fi

          if existing="$(git rev-parse -q --verify "refs/tags/$tag^{commit}")"; then
            if [ "$existing" != "$GITHUB_SHA" ]; then
              problem "태그 $tag 가 이미 다른 커밋($existing)에 있다. plugin.json version 을 올리지 않고 병합한 것이다. 태그는 옮기지 않는다. 다음: version 을 올리는 PR 을 병합하라."
              exit 1
            fi
            echo "태그 $tag 가 이미 이 커밋에 있다. 그대로 둔다."
          else
            git tag "$tag" "$GITHUB_SHA"
            git push origin "refs/tags/$tag"
            mark_tagged "$tag"
            echo "태그 $tag 를 $GITHUB_SHA 에 붙였다."
          fi

          if old="$(git rev-parse -q --verify "refs/tags/stable^{commit}")"; then
            if ! git merge-base --is-ancestor "$old" "$GITHUB_SHA"; then
              problem "stable($old)이 이 커밋($GITHUB_SHA)의 조상이 아니라 옮기지 않았다. 더 새로운 실행이 이미 stable 을 옮겼을 수 있다. 다음: stable 이 의도한 판을 가리키는지 확인하라."
              exit 0
            fi
          fi
          git tag -f stable "$GITHUB_SHA"
          git push -f origin refs/tags/stable
          echo "stable 을 $tag ($GITHUB_SHA) 로 옮겼다."

      - name: 실패하거나 건너뛰면 이슈로 알리기
        if: failure() || steps.tag.outputs.problem != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # gh issue 가 저장소를 확실히 찾도록 명시한다.
          GH_REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          PROBLEM: ${{ steps.tag.outputs.problem }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="release-tag: 엔진 판 배포가 안 됐다"
          {
            printf -- '- 커밋: %s\n- 실행: %s\n- 사유: %s\n\n' "$SHA" "$RUN_URL" "${PROBLEM:-(사유가 남지 않았다. 실행 로그를 확인한다.)}"
            printf '엔진 판 태그 v{version} 과 stable 이 이 커밋 기준으로 갱신되지 않았을 수 있다. 훅은 v{version} 태그로, Project Repository 는 stable 로 엔진을 받으므로 확인이 필요하다.\n'
            printf '고친 뒤 Actions 의 release-tag 를 workflow_dispatch 로 다시 실행한다(main 에서).\n'
          } > body.md

          # 같은 제목의 열린 알림 이슈가 있으면 새로 만들지 않고 코멘트만 남긴다.
          found="$(gh issue list --state open --limit 100 --json number,title \
            | jq -r --arg t "$title" '.[] | select(.title == $t) | .number' | head -n1)"
          if [ -n "$found" ]; then
            gh issue comment "$found" --body-file body.md
            exit 0
          fi

          # 이슈는 한 번만 만든다. 라벨·담당자(저장소 owner)는 만든 뒤에 따로 붙이고, 실패해도 경고만 남긴다.
          # owner 가 조직이면 담당자가 될 수 없으므로 사용자일 때만 지정한다.
          if ! url="$(gh issue create --title "$title" --body-file body.md)"; then
            echo "::error title=알림 이슈 생성 실패::엔진 판 배포 실패 알림 이슈를 열지 못했다."
            exit 1
          fi
          num="${url##*/}"
          if [ -z "$num" ]; then
            echo "::error title=알림 이슈 번호 불명::이슈 생성 출력에서 번호를 읽지 못했다: $url"
            exit 1
          fi
          echo "이슈를 열었다: $url"
          gh api -X POST "repos/${GH_REPO}/issues/${num}/labels" -f "labels[]=type:chore" >/dev/null \
            || echo "::warning title=라벨 지정 실패::type:chore 라벨을 붙이지 못했다."
          owner_type="$(gh api "repos/${GH_REPO}" --jq '.owner.type' 2>/dev/null || true)"
          if [ "$owner_type" = "User" ]; then
            gh api -X POST "repos/${GH_REPO}/issues/${num}/assignees" -f "assignees[]=${OWNER}" >/dev/null \
              || echo "::warning title=담당자 지정 실패::${OWNER} 를 담당자로 지정하지 못했다."
          else
            echo "저장소 소유자($OWNER)가 사용자가 아니어서(${owner_type:-확인 불능}) 담당자를 지정하지 않는다."
          fi

      # 새 태그를 붙였을 때만. 이슈 알림 단계와 따로 돌며, 실패해도 job 결과를 바꾸지 않는다(continue-on-error).
      # 태그 단계가 도중에 실패했어도 그 전에 붙인 태그가 있으면 알린다.
      - name: Teams 로 새 판 알리기
        if: ${{ !cancelled() && steps.tag.outputs.tagged != '' }}
        continue-on-error: true
        shell: bash
        env:
          WEBHOOK: ${{ secrets.TEAMS_PLUGIN_ALERT_WEBHOOK }}
          TAGGED: ${{ steps.tag.outputs.tagged }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GUIDE_URL: https://claude.ai/artifact/HD5TUKWCEbaAkYE9vSUkR8
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::notice title=Teams 알림 건너뜀::TEAMS_PLUGIN_ALERT_WEBHOOK 이 비어 있다."
            exit 0
          fi

          # 알림 실패는 경고로만 남기고 0 으로 끝낸다.
          warn() { echo "::warning title=Teams 알림 실패::$1"; exit 0; }

          # 이번에 붙인 태그: 가장 앞 판(first)과 가장 뒤 판(last).
          sorted="$(printf '%s\n' $TAGGED | sort -V)" || warn "태그 목록을 정렬하지 못했다."
          first="$(printf '%s\n' "$sorted" | head -n1)"
          last="$(printf '%s\n' "$sorted" | tail -n1)"
          heading="하네스 $(printf '%s' "$sorted" | paste -sd, - | sed 's/,/, /g') 배포됨"

          # 직전 태그: 가장 앞 판 바로 앞의 v 태그. 없으면 병합 목록을 만들 수 없다.
          prev="$(git tag --list 'v[0-9]*' | sort -V | awk -v f="$first" '$0==f{print p; exit} {p=$0}')" || prev=""
          : > prs.txt
          if [ -n "$prev" ]; then
            git log --first-parent --format=%s "$prev..$last" > prs.txt || warn "병합 목록을 읽지 못했다."
            range="직전 판 $prev 이후 main 에 병합된 변경"
          else
            range="직전 판을 찾지 못해 병합 목록은 생략한다."
          fi

          jq -n --arg heading "$heading" --arg range "$range" --rawfile prs prs.txt \
            --arg todo "자동 업데이트가 켜져 있으면 Claude Code 를 쓰는 동안 새 판을 받아 두고(첫 메시지 뒤 최대 10분), 다음에 열 때부터 적용된다. 열려 있는 세션에서 바로 쓰려면 /reload-plugins. 그 전까지는 PC 훅이 옛 판이라 PR 검사 결과와 다를 수 있다." \
            --arg guide "$GUIDE_URL" --arg run "$RUN_URL" '
            ($prs | split("\n") | map(select(length > 0))) as $lines
            | {
              type: "message",
              attachments: [{
                contentType: "application/vnd.microsoft.card.adaptive",
                contentUrl: null,
                content: {
                  "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                  type: "AdaptiveCard",
                  version: "1.4",
                  body: (
                    [{type: "TextBlock", text: $heading, weight: "Bolder", size: "Medium", wrap: true},
                     {type: "TextBlock", text: $range, wrap: true, isSubtle: true}]
                    + ($lines[:20] | map({type: "TextBlock", text: ("- " + .), wrap: true, spacing: "None"}))
                    + (if ($lines | length) > 20 then [{type: "TextBlock", text: ("… 외 " + (($lines | length) - 20 | tostring) + "건"), wrap: true, spacing: "None"}] else [] end)
                    + [{type: "TextBlock", text: ("팀원 할 일: " + $todo), wrap: true, separator: true}]
                  ),
                  actions: [
                    {type: "Action.OpenUrl", title: "길잡이 열기", url: $guide},
                    {type: "Action.OpenUrl", title: "실행 보기", url: $run}
                  ]
                }
              }]
            }' > payload.json || warn "카드 JSON 을 만들지 못했다."

          # 웹훅 URL 자체가 비밀이므로 출력하지 않는다.
          curl -sS --fail-with-body -X POST -H "Content-Type: application/json" \
            --data @payload.json "$WEBHOOK" > /dev/null || warn "웹훅 전송이 실패했다. 태그 결과에는 영향이 없다."
