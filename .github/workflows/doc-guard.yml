# 문서 저장소가 가져다 쓰는 재사용 워크플로.
#
# 이 저장소가 아니라 client-docs 같은 문서 저장소에서 불린다. 바뀐 문서만 골라 검사하고,
# 위반이면 job 을 실패시키고 PR 에 결과를 남긴다.
#
# main 에 push 된 커밋이 실패하면(#95 — 무료 비공개 저장소라 branch protection 을
# 걸 수 없어, PR 검사가 실패한 채로 병합됐을 수 있다) 이슈를 열어 알린다. 재사용
# 워크플로 자체는 permissions 를 선언하지 않으므로 — job 에 permissions 를 적으면
# 적지 않은 권한은 모두 none 이 된다 — 이슈를 열려면 부르는 쪽이 issues: write 를
# 함께 줘야 한다.
#
# 문서 저장소 쪽에서는 이렇게 부른다.
#
#   jobs:
#     doc-guard:
#       uses: jaeheeMin/blueward-harness/.github/workflows/doc-guard.yml@main
#       permissions:
#         contents: read
#         pull-requests: write
#         issues: write   # main push 실패를 이슈로 알리려면 필요하다

name: doc-guard

on:
  workflow_call:
    inputs:
      engine-ref:
        description: 검사 엔진을 가져올 blueward-harness 의 ref
        type: string
        default: main
      comment:
        description: 결과를 PR 코멘트로 남길지
        type: boolean
        default: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 문서 저장소 가져오기
        uses: actions/checkout@v4
        with:
          # 바뀐 파일을 알아내려면 비교 대상 커밋이 있어야 한다.
          fetch-depth: 0

      - name: 검사 엔진 가져오기
        uses: actions/checkout@v4
        with:
          repository: jaeheeMin/blueward-harness
          ref: ${{ inputs.engine-ref }}
          path: .doc-guard-engine

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 바뀐 문서 찾기
        id: changed
        shell: bash
        run: |
          # PR 이면 기준 브랜치와 비교하고, push 면 직전 커밋과 비교한다.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
            git fetch origin "${{ github.base_ref }}" --depth=1 -q
          else
            base="${{ github.event.before }}"
          fi
          # 지워진 파일은 검사할 수 없으므로 뺀다(--diff-filter=d).
          #
          # core.quotepath=false 가 없으면 git 이 비ASCII 경로를 따옴표와 8진수로 감싸
          # 내놓는다. 이 저장소의 문서는 파일명도 폴더명도 한글이라 거의 모든 경로가
          # 여기 걸리고, 검사기는 존재하지 않는 경로를 받게 된다.
          git -c core.quotepath=false diff --name-only --diff-filter=d "$base" HEAD > changed.txt || git -c core.quotepath=false ls-files > changed.txt
          echo "바뀐 파일:"; cat changed.txt
          if [ ! -s changed.txt ]; then echo "none=true" >> "$GITHUB_OUTPUT"; fi

      - name: 검사
        if: steps.changed.outputs.none != 'true'
        id: check
        shell: bash
        run: |
          set +e
          uv run --project .doc-guard-engine python .doc-guard-engine/scripts/check_changed.py changed.txt > report.json 2> error.txt
          code=$?
          set -e
          echo "exit-code=$code" >> "$GITHUB_OUTPUT"
          cat error.txt >&2 || true
          exit 0

      - name: 결과 정리
        if: steps.changed.outputs.none != 'true'
        id: render
        shell: bash
        run: |
          uv run --project .doc-guard-engine python .doc-guard-engine/scripts/render_report.py \
            report.json "${{ steps.check.outputs.exit-code }}" > comment.md
          cat comment.md >> "$GITHUB_STEP_SUMMARY"
          cat comment.md

      - name: PR 에 남기기
        if: inputs.comment && github.event_name == 'pull_request' && steps.changed.outputs.none != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('comment.md', 'utf8');
            const marker = '<!-- doc-guard -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const existing = await github.rest.issues.listComments({ owner, repo, issue_number });
            const mine = existing.data.find(c => c.body.includes(marker));
            // 새 코멘트를 쌓지 않고 하나를 고쳐 쓴다. PR 하나에 코멘트가 줄줄이
            // 달리면 무엇이 최신인지 알기 어렵다.
            if (mine) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: 판정
        if: steps.changed.outputs.none != 'true'
        shell: bash
        run: |
          # 위반(1)과 검사 불능(그 밖의 전부)은 받는 사람이 다르므로 주석 제목부터
          # 갈라 둔다. 둘 다 job 은 실패하지만, "무엇이 실패했는지" 를 한눈에
          # 구분하지 못하면 문서를 고쳐야 할 사람과 규칙을 고쳐야 할 사람이 뒤섞인다.
          code="${{ steps.check.outputs.exit-code }}"
          case "$code" in
            0)
              echo "통과"
              ;;
            1)
              # 문서(doc-guard)나 코드(공통 개발 규칙, #54) 어느 쪽이 위반인지는 이
              # 종료코드만으로 갈리지 않는다 — PR 코멘트가 절을 나눠 보여준다.
              echo "::error title=harness 위반::문서 또는 코드가 규칙을 따르지 않습니다. PR 코멘트를 보십시오."
              {
                echo ""
                echo "### harness 판정: ❌ 위반"
                echo "문서 또는 코드를 고쳐야 합니다. 어느 쪽인지는 위 PR 코멘트를 보십시오."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
              ;;
            2)
              echo "::error title=harness 검사 불능::규칙 파일이나 검사 엔진에 문제가 있어 검사할 수 없습니다. 담당자에게 알리십시오."
              {
                echo ""
                echo "### harness 판정: ⚠️ 검사 불능"
                echo "규칙·설정을 고쳐야 합니다. 문서나 코드의 문제가 아닙니다."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
              ;;
            *)
              echo "::error title=doc-guard 검사 불능::검사기가 예상치 못한 코드 $code 로 끝났습니다."
              {
                echo ""
                echo "### doc-guard 판정: ⚠️ 검사 불능"
                echo "규칙·설정을 고쳐야 합니다. 문서의 문제가 아닙니다."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
              ;;
          esac

      - name: main push 실패를 이슈로 알리기
        if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # 이 저장소는 개인 비공개 Project Repository 라 branch protection 을 걸 수
          # 없다(문서 상단 참고, ssot-approval.yml 과 같은 사정). PR 검사가 실패한
          # 채로 병합됐을 수 있으니, main 에서마저 실패하면 최소한 이슈로 남겨 놓친
          # 채 지나가지 않게 한다. 이 스텝은 판정을 되돌리지 않는다 — job 은 위
          # 판정 스텝에서 이미 실패로 끝났고, 이 스텝이 성공해도 그 결과는 바뀌지
          # 않는다.
          sha_short="${GITHUB_SHA:0:7}"
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          commit_url="${{ github.server_url }}/${{ github.repository }}/commit/${GITHUB_SHA}"
          prefix="main 의 doc-guard 검사 실패:"
          title="$prefix $sha_short"
          body="커밋: ${GITHUB_SHA} ($commit_url)
          워크플로 실행: $run_url

          병합 전 PR 검사가 실패한 채 병합됐을 수 있다. 원인을 고친 PR 을 올린다."

          # 같은 원인으로 이미 열려 있는 이슈가 있으면 새로 만들지 않고 코멘트만
          # 남긴다(제목 접두어로 판단 — 커밋마다 sha 가 달라 제목 전체는 못 맞춘다).
          existing_number="$(gh issue list --state open --json number,title \
            --jq ".[] | select(.title | startswith(\"$prefix\")) | .number" | head -n1)"
          if [ -n "$existing_number" ]; then
            gh issue comment "$existing_number" --body "$body"
            exit 0
          fi

          # 라벨이 없는 저장소에서도 실패하지 않게, 있을 때만 붙인다.
          if gh label list --json name --jq '.[].name' 2>/dev/null | grep -qxF "type:fix"; then
            gh issue create --title "$title" --body "$body" --label "type:fix"
          else
            gh issue create --title "$title" --body "$body"
          fi
