# 이 저장소 자신의 열린 PR 에 병합 순서 코멘트와 커밋 status `merge-order` 를 단다(#383, #370).
# 이 저장소에서는 열린 PR 끼리 plugin.json version 이 낮은 것부터 병합해야 해서 그 순서를 GitHub 화면에
# 드러낸다. 옛 재사용 워크플로 `pr-queue.yml` 을 지울 때(#452) 그 job 을 이 파일로 옮겼다(재사용 호출 없이 직접 돈다).
# Project Repository 는 `pr-checks.yml`·`pr-review.yml`·`main-checks.yml` 의 pr-queue 단계가 같은 일을 한다.
#
# 열린 PR 의 병합 순서를 GitHub 화면에 남긴다(#370). 엔진(`checker.pr_queue_actions`)이 열린 PR 전체의
# 상태·순서를 한 번 계산해, 열린 PR 마다
#   - 코멘트 하나(마커 `<!-- pr-queue -->`)를 만들거나 갱신하고(내용이 같으면 쓰지 않는다),
#   - 커밋 status `merge-order` 를 단다(앞 PR 이 열려 있으면 pending(노란 대기), 없으면 success, 순서를 정하지
#     못하면 error),
#   - 앞 PR 이 병합돼 이제 앞이 하나도 없게 된 PR 이 있으면 작성자를 @멘션하고(새 코멘트), Teams
#     웹훅(`TEAMS_PLUGIN_ALERT_WEBHOOK`)이 있으면 Teams 로도 알린다.
# 무료 요금제는 노란 대기여도 Merge 버튼을 잠그지 못하므로 `merge-order` 는 막는 것이 아니라 드러내는 것이고,
# Claude 의 `gh pr merge` 는 훅이 막는다.
#
# GitHub 를 읽지 못하면 통과도 위반도 아니다(CLAUDE.md 원칙 7). job 을 실패시키고 사유를 job 요약에 남긴다.
# 포크에서 온 PR 의 이벤트는 토큰이 읽기 전용이라 쓰지 않고 요약만 남긴다.
#
# job id 는 `pr-queue`, 이름은 `pr-queue / queue` 로 둔다. 재사용 호출 때의 check 이름과 같게 하려는 것이다
# (다른 검사와 엔진이 이 check 를 순서 표시로 알아보고 검사 실패에서 뺀다).
name: pr-queue
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, closed]
  pull_request_review:
    types: [submitted, dismissed]
  push:
    branches: [main]

jobs:
  pr-queue:
    name: pr-queue / queue
    # 병합으로 닫힌 PR 은 건너뛴다(#482). 같은 순간 뜨는 push(main) 실행이 같은 계산을 하고, 둘이 아래
    # concurrency 로 서로 취소해 병합된 PR 에 취소(실패)가 남았다. 병합 없이 닫힌 PR 은 push 가 없어 그대로 돈다.
    if: ${{ !(github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      issues: write
      statuses: write
      checks: read
      actions: read
    # 모든 실행이 열린 PR 전체를 처음부터 다시 계산하므로, 이전 실행은 낡았다. 취소하고 최신으로 한다.
    # (차례 알림은 이벤트가 아니라 직전 코멘트와의 차이로 정해 취소돼도 사라지지 않는다.)
    concurrency:
      group: pr-queue-${{ github.repository }}
      cancel-in-progress: true
    steps:
      - name: 계산 엔진 가져오기
        uses: actions/checkout@v4
        with:
          repository: jaeheeMin/blueward-harness
          ref: stable
          path: .harness-engine

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 병합 순서 계산과 코멘트·status·알림
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TEAMS_PLUGIN_ALERT_WEBHOOK: ${{ secrets.TEAMS_PLUGIN_ALERT_WEBHOOK }}
        run: |
          set +e
          uv run --project .harness-engine python .harness-engine/scripts/pr_queue_actions.py \
            --repo "$GITHUB_REPOSITORY" --event-path "$GITHUB_EVENT_PATH" --summary-file "$GITHUB_STEP_SUMMARY"
          code=$?
          set -e
          case "$code" in
            0)
              ;;
            1)
              echo "::error title=병합 순서 쓰기 실패::코멘트나 status 를 쓰지 못한 PR 이 있다. 사유는 job 요약에 있다. permissions(pull-requests·issues·statuses: write)를 확인한다."
              exit 1
              ;;
            *)
              echo "::error title=병합 순서 확인 불능::GitHub 를 읽지 못해 순서를 계산하지 못했거나 처리 중 예상 못 한 오류가 났다(종료코드 $code). 통과로 보지 않는다. 사유는 job 요약에 있다."
              exit 1
              ;;
          esac
