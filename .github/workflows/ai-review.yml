# Project Repository 가 가져다 쓰는 재사용 워크플로(#125).
#
# 코드(`src/`)를 바꾼 PR 에(위험한 PR 포함, #360, #411) Claude 로 코드 리뷰를 돌리고, 심각한 지적이 나오거나 일부만 봤으면
# 이 검사(`ai-review`)를 실패시킨다. 그러면 risk-gate 의 `ai_review` 기준이 그 결과를 읽어 "승인 필요"
# 로 판정한다. Claude CLI 는 이 워크플로가 직접 부른다(#460) — 예전의 `anthropics/claude-code-action` 은 Anthropic
# 서버가 워크플로 파일이 기본 브랜치와 같은지 보고 다르면(스택 PR 이 옛 호출 워크플로를 가진 경우) 액션을 조용히
# 건너뛰어 결과 파일이 안 만들어졌다. 위험한 PR 은 AI 리뷰에 더해 승인자 Approve 도 필요하다(승인 판정은 바뀌지 않는다).
# **기본은 꺼짐이다.** 켜려면 Project Repository 에서 (1) `claude setup-token` 으로 만든 1년짜리
# 구독 OAuth 토큰을 `gh secret set CLAUDE_CODE_OAUTH_TOKEN -R <owner/repo>` 로 등록하고
# (2) `.github/risk-gate.yaml` 의 `ai_review` 를 true 로 바꾼다. `ai_review` 가 false 이거나
# risk-gate.yaml 이 없으면 이 워크플로는 리뷰를 돌리지 않고 건너뛴다.
#
# 순서:
#   1. 사전 판정 — `checker.risk_gate precheck-pr`. 설정을 확인하고, 크기·위험 경로·비밀값 기준으로
#      위험 여부(`risky`·`reasons`)를 출력한다(다른 검사의 결과와 ai-review 자신은 보지 않는다 — 서로를
#      기다리는 교착 방지). 종료코드 3(설정 없음·꺼짐·`ai_review_paths` 에 걸린 파일 없음)이면 리뷰 없이 건너뛰고 성공으로 끝낸다. 위험한
#      PR 도 리뷰를 돌리며, 위험 여부는 코멘트에 "위험 PR — 승인자 Approve 도 필요" 로 적는 데만 쓴다.
#      **단, 새로 들어온 줄에 비밀값 패턴이 실제로 보이면(종료코드 4) 리뷰를 돌리지 않는다** — diff 를 외부 AI 에
#      보내지 않기 위해서다. 이때는 시크릿 확인·Claude 단계를 건너뛰고 ai-review 를 실패(`secret`, 검사 불능 —
#      승인자가 직접 확인)시켜 통과로 보이지 않게 한다. 변경이
#      너무 커서 비밀값 검사를 못 한 파일은 이 예외가 아니다(큰 PR 은 계속 리뷰한다). 종료코드 4 를 모르는 옛
#      워크플로는 "판정 불능" 으로 읽어 역시 리뷰를 돌리지 않는다. 반대로 종료코드 0 인데 결과에 `secret_found`
#      키가 없으면(비밀값 확인을 모르는 옛 엔진) 판정 불능(2)으로 바꿔 역시 리뷰를 돌리지 않는다.
#      **값**은 어디에도 남지 않는다. 위치(파일:줄)는 risk-gate 사유처럼 job 로그(precheck 출력)에 남고,
#      ai-review 코멘트·표식에는 패턴 이름만 적는다.
#   2. 시크릿 확인 — 토큰이 없으면 통과시키지 않고 "검사 불능" 으로 실패한다(CLAUDE.md 원칙 7).
#      포크 PR 에는 시크릿이 전달되지 않으므로 포크 PR 도 여기서 검사 불능이 된다.
#   3. Claude CLI 설치와 리뷰(#460) — `claude-code-version` 입력의 판으로 고정 설치하고(자동 갱신은 끈다) 엔진의
#      `checker.ai_review` 가 부른다. 바뀐 파일 가운데 **코드 파일만** 리뷰 대상이고(문서 `*.md`·`docs/` 아래·오피스·PDF·
#      이미지·바이너리는 "AI 리뷰 대상 아님" 으로 따로 센다. 못 본 것이 아니다), 파일별 diff 를 `batch-chars` 글자 이하 묶음으로
#      나눠 묶음마다 `claude -p` 를 한 번씩 돌린다(큰 파일은 hunk 단위로 쪼갠다). 묶음은 `max-batches` 개까지만 돌리고, 넘는
#      묶음의 파일과 실패·시간 초과한 묶음의 파일은 `unreviewed` 가 된다. **다 봤는지(coverage)는 모델이 아니라 엔진이
#      정한다** — 대상 파일 전부가 성공한 묶음에 들었으면 full, 아니면 partial. 성공한 묶음이 하나도 없으면 결과 파일을
#      만들지 않고 사유 파일(`ai-review-unavailable.json`)만 남겨 검사 불능이 된다. 이 단계에는 job 보다 짧은 timeout 을
#      둬, 시간이 다 돼도 4·5 단계(`always()`)가 돌아 결과를 밝힌다.
#   4. 결과 정리 — 파일이 없거나 형식이 틀리면 검사 불능, serious 가 1 이상이면 실패, 일부만 봤으면
#      partial(실패), 아니면 성공. PR 코멘트 하나(마커 `<!-- ai-review -->`)를 갱신하고 job 요약에도 같은
#      내용을 남긴다. 코멘트 끝에는 risk-gate 가 읽는 숨은 표식 `<!-- ai-review-result {...} -->` 가 붙는다.
#
# 실패에는 세 가지가 있고 뭉개지 않는다 — "심각한 지적", "일부만 봄", "검사 불능". 코멘트가 어느 쪽인지 밝힌다.
# 비밀값 의심으로 리뷰를 건너뛴 경우는 검사 불능의 한 갈래로, 표식 status 가 `secret` 이다.
#
# 이 워크플로는 비신뢰 입력(코드)을 Claude 에게 읽힌다. 프롬프트가 그 안의 지시를 따르지 말라고 명시하고, 허용 도구도
# 읽기(Read·Glob·Grep)로만 좁혀 둔다. 쓰기·셸 도구는 없고, 허용 밖 요청은 물어보지 않고 거절한다.
# `ANTHROPIC_API_KEY` 는 비워서 구독 토큰(`CLAUDE_CODE_OAUTH_TOKEN`)만 쓰게 한다.
# diff 안의 프롬프트 인젝션이 Read 로 토큰(환경 변수, `.git/config`)을 읽어 지적 문장으로 PR 코멘트에 싣는 길은 겹겹이
# 막는다 — 체크아웃에 토큰을 남기지 않고(`persist-credentials: false`), 도구를 읽기로만 줄이고 민감 경로 읽기를 거부하고,
# PR 이 심은 `.claude/`·`.mcp.json`·`CLAUDE.md` 를 지우고(`--scrub-config`), Claude 프로세스의 환경 변수를 허용 목록으로
# 줄이고, 결과에 비밀값이 섞였으면 결과를 쓰지 않고 검사 불능으로 끝낸다(`checker/ai_review.py`).
#
# 부르는 쪽은 아래 권한을 명시해야 한다(재사용 워크플로는 호출한 쪽의 권한을 넘지 못한다). 액션을 쓰지 않으므로
# `id-token: write` 는 더 이상 필요 없다. 호출 워크플로에 남아 있어도 동작에는 영향이 없다(호출한 쪽이 더 많이 줘도
# 이 워크플로가 요청하지 않는다) — 호출 워크플로는 이 저장소 밖(Project Repository)에 있으니 고치는 때에 지워도 된다.
#
#   on:
#     pull_request:
#       types: [opened, synchronize, reopened, ready_for_review]
#       paths: ['src/**']   # 코드를 바꾼 PR 만. `.github/risk-gate.yaml` 의 `ai_review_paths: [src/]` 와 같은 뜻(#411)
#   jobs:
#     ai-review:          # job id 는 반드시 ai-review — risk-gate 가 이 이름의 check run 을 읽는다.
#       uses: jaeheeMin/blueward-harness/.github/workflows/ai-review.yml@stable
#       secrets:
#         CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
#       permissions:
#         contents: read
#         pull-requests: write
#         issues: read

name: ai-review

on:
  workflow_call:
    inputs:
      engine-ref:
        description: 판정 로직을 가져올 blueward-harness 의 ref
        type: string
        default: stable
      model:
        description: 리뷰에 쓸 Claude 모델
        type: string
        default: sonnet
      max-turns:
        description: 묶음 하나를 리뷰할 때 Claude 가 쓸 수 있는 최대 턴 수
        type: number
        default: 15
      max-batches:
        description: 리뷰할 묶음의 최대 개수(넘는 묶음의 파일은 못 본 것으로 센다)
        type: number
        default: 8
      batch-chars:
        description: 묶음 하나의 diff 최대 글자 수
        type: number
        default: 60000
      claude-code-version:
        description: 설치할 Claude Code 판(고정). 자동 갱신은 끈다
        type: string
        default: 2.1.310
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        description: "`claude setup-token` 으로 만든 구독 OAuth 토큰"
        required: false

jobs:
  review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 새 커밋이 오면 이전 리뷰는 낡은 것이므로 취소하고 최신으로 다시 돌린다.
    concurrency:
      group: ai-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      issues: read
    steps:
      - name: 판정 엔진 가져오기
        uses: actions/checkout@v4
        with:
          repository: jaeheeMin/blueward-harness
          ref: ${{ inputs.engine-ref }}
          path: .harness-engine
          persist-credentials: false

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: AI 리뷰를 돌려도 되는지 사전 판정
        id: pre
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set +e
          uv run --project .harness-engine python .harness-engine/scripts/risk_gate.py \
            precheck-pr --repo "$GITHUB_REPOSITORY" --pr "$PR_NUMBER" \
            > "$RUNNER_TEMP/precheck.json" 2> "$RUNNER_TEMP/precheck.err"
          code=$?
          set -e
          # 종료코드 0 인데 `secret_found` 키가 없으면 비밀값 확인을 하지 않는 옛 엔진(engine-ref 가 옛 판)이다.
          # 확인 없이 diff 를 AI 에 보내지 않도록 판정 불능(2)으로 바꾸고, 결과 정리가 읽을 사유를 남긴다.
          if [ "$code" = "0" ]; then
            if ! python3 -c 'import json,sys; sys.exit(0 if "secret_found" in json.load(open(sys.argv[1], encoding="utf-8")) else 1)' "$RUNNER_TEMP/precheck.json" 2>/dev/null; then
              code=2
              echo '{"reasons": ["엔진이 비밀값 확인 결과를 내지 않음(engine-ref 가 옛 판일 수 있음)"]}' > "$RUNNER_TEMP/precheck.json"
            fi
          fi
          echo "exit-code=$code" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/precheck.err" >&2 || true
          cat "$RUNNER_TEMP/precheck.json" || true

      - name: 토큰 확인
        id: token
        if: steps.pre.outputs.exit-code == '0'
        shell: bash
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "missing=true" >> "$GITHUB_OUTPUT"
          else
            echo "missing=false" >> "$GITHUB_OUTPUT"
          fi

      # 엔진 checkout 은 작업 폴더 안(.harness-engine)에 있으므로 clean 을 끈다. 켜 두면 PR checkout 이
      # 추적되지 않는 .harness-engine 을 지운다.
      - name: PR head 가져오기
        if: steps.pre.outputs.exit-code == '0' && steps.token.outputs.missing == 'false'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          clean: false
          # .git/config 에 토큰(extraheader)을 남기지 않는다. Claude 가 Read 로 읽어 지적 문장에 실을 수 있다.
          persist-credentials: false

      - name: Claude Code 설치
        id: install
        if: steps.pre.outputs.exit-code == '0' && steps.token.outputs.missing == 'false'
        # 실패해도 결과 정리 단계가 "검사 불능" 으로 밝히도록 여기서는 멈추지 않는다.
        continue-on-error: true
        shell: bash
        env:
          CLAUDE_CODE_VERSION: ${{ inputs.claude-code-version }}
        run: |
          curl -fsSL https://claude.ai/install.sh | bash -s "$CLAUDE_CODE_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          # 판이 바뀌면 같은 PR 을 다시 돌려도 결과가 달라질 수 있어 자동 갱신을 끈다.
          echo "DISABLE_UPDATES=1" >> "$GITHUB_ENV"
          export PATH="$HOME/.local/bin:$PATH"
          claude --version
          case "$(claude --version)" in
            "$CLAUDE_CODE_VERSION"*) ;;
            *) echo "::error::설치된 Claude Code 판이 요청한 $CLAUDE_CODE_VERSION 과 다르다"; exit 1 ;;
          esac

      - name: Claude 리뷰
        id: claude
        if: steps.pre.outputs.exit-code == '0' && steps.token.outputs.missing == 'false' && steps.install.outcome == 'success'
        # 실패해도 결과 정리 단계가 "검사 불능" 으로 밝히도록 여기서는 멈추지 않는다.
        continue-on-error: true
        # job 의 timeout(20분)보다 짧게 둔다. 큰 PR 에서 시간이 다 돼도 이후 `always()` 단계(결과 정리·코멘트·판정)가
        # 돌아 "검사 불능" 을 밝히게 하기 위해서다. job timeout 이 먼저 오면 그 단계들이 돌지 못한다.
        # 엔진의 전체 제한 시간(--total-timeout 780초)도 이 값보다 짧아, 시간이 모자라면 남은 묶음을 못 본 것으로 적고 끝낸다.
        timeout-minutes: 15
        shell: bash
        env:
          # 구독 토큰만 쓴다. API 키가 있으면 `claude -p` 가 그것을 먼저 쓰므로 비운다.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ""
          # 엔진이 결과에 이 값이 섞였는지 비교하는 데만 쓴다. Claude 프로세스에는 넘어가지 않는다(자식 환경은 허용 목록).
          GITHUB_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MODEL: ${{ inputs.model }}
          MAX_TURNS: ${{ inputs.max-turns }}
          MAX_BATCHES: ${{ inputs.max-batches }}
          BATCH_CHARS: ${{ inputs.batch-chars }}
        run: |
          uv run --project .harness-engine python .harness-engine/scripts/ai_review.py run \
            --repo "$GITHUB_WORKSPACE" --base "$BASE_SHA" --head "$HEAD_SHA" --out "$RUNNER_TEMP" \
            --model "$MODEL" --max-turns "$MAX_TURNS" --max-batches "$MAX_BATCHES" --batch-chars "$BATCH_CHARS" \
            --total-timeout 780 --scrub-config

      - name: 결과 정리
        id: result
        if: always()
        shell: bash
        env:
          PRE_CODE: ${{ steps.pre.outputs.exit-code }}
          TOKEN_MISSING: ${{ steps.token.outputs.missing }}
          CLAUDE_OUTCOME: ${{ steps.claude.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os

          temp = os.environ["RUNNER_TEMP"]
          code = os.environ.get("PRE_CODE", "")
          token_missing = os.environ.get("TOKEN_MISSING", "")
          claude_outcome = os.environ.get("CLAUDE_OUTCOME", "")
          install_outcome = os.environ.get("INSTALL_OUTCOME", "")
          head_sha = os.environ.get("HEAD_SHA", "")
          MARKER_FINDINGS = 5
          UNREVIEWED_SHOWN = 20


          def clean(text, limit=300):
              # 모델이 쓴 문장이다. 멘션이 되지 않게 하고, HTML 주석을 열고 닫는 `<!--`·`-->` 를 깨서(가짜 표식이
              # 보이는 본문에 못 들어가게) 한 줄로 줄이며 길이를 자른다.
              text = " ".join(str(text).split()).replace("@", "@​")
              text = text.replace("<!--", "<!​--").replace("-->", "--​>")
              return text if len(text) <= limit else text[:limit] + "..."


          def read_precheck():
              """(위험 여부, 사유 목록, 사유를 낸 기준 이름 목록). 못 읽으면 (False, [], [])."""
              try:
                  with open(os.path.join(temp, "precheck.json"), encoding="utf-8") as f:
                      data = json.load(f)
                  return (bool(data.get("risky")), [str(r) for r in data.get("reasons", [])],
                          [str(c) for c in data.get("criteria", [])])
              except Exception:
                  return False, [], []


          def read_secret_patterns():
              """사전 판정이 낸 비밀값 패턴 이름 목록(값은 없다). 못 읽으면 []."""
              try:
                  with open(os.path.join(temp, "precheck.json"), encoding="utf-8") as f:
                      return [str(n) for n in json.load(f).get("secret_patterns", [])]
              except Exception:
                  return []


          def read_unavailable_reason():
              """엔진이 검사 불능일 때 남기는 사유(ai-review-unavailable.json). 없으면 ''."""
              try:
                  with open(os.path.join(temp, "ai-review-unavailable.json"), encoding="utf-8") as f:
                      return str(json.load(f).get("reason", ""))
              except Exception:
                  return ""


          def read_extra(data):
              """엔진이 덧붙인 키(제외 파일, 못 본 사유, 코드 없음). 없거나 틀리면 비어 있는 것으로 읽는다."""
              excluded = data.get("excluded")
              excluded = [str(e.get("file")) for e in excluded if isinstance(e, dict) and e.get("file")] \
                  if isinstance(excluded, list) else []
              reasons = data.get("unreviewed_reasons")
              reasons = {str(k): str(v) for k, v in reasons.items()} if isinstance(reasons, dict) else {}
              return {"excluded": excluded, "reasons": reasons, "no_code": data.get("no_code_to_review") is True}


          def parse_review():
              """(지적 목록, serious 수, 못 본 파일 목록, 일부만 봤는지, 덧붙인 키) 를 돌려준다. 형식이 틀리면 ValueError."""
              path = os.path.join(temp, "ai-review.json")
              if not os.path.isfile(path):
                  raise ValueError("결과 파일(ai-review.json)이 만들어지지 않았다")
              try:
                  with open(path, encoding="utf-8") as f:
                      data = json.load(f)
              except Exception as exc:
                  raise ValueError(f"결과 파일이 올바른 JSON 이 아니다: {type(exc).__name__}") from exc
              if not isinstance(data, dict):
                  raise ValueError("결과 파일의 최상위가 객체가 아니다")
              serious = data.get("serious")
              findings = data.get("findings")
              if isinstance(serious, bool) or not isinstance(serious, int) or serious < 0:
                  raise ValueError("serious 가 0 이상의 정수가 아니다")
              if not isinstance(findings, list):
                  raise ValueError("findings 가 목록이 아니다")
              for item in findings:
                  if not isinstance(item, dict) or item.get("severity") not in ("serious", "minor"):
                      raise ValueError("findings 항목의 severity 가 serious 또는 minor 가 아니다")
                  if not isinstance(item.get("file"), str) or not isinstance(item.get("summary"), str):
                      raise ValueError("findings 항목에 file 또는 summary 문자열이 없다")
                  line = item.get("line")
                  if isinstance(line, bool) or not isinstance(line, int):
                      raise ValueError("findings 항목의 line 이 정수가 아니다")
              if serious != sum(1 for i in findings if i["severity"] == "serious"):
                  raise ValueError("serious 개수가 findings 의 serious 항목 수와 다르다")
              # coverage·unreviewed 가 없는 옛 형식은 "다 봄" 으로 읽는다(호환). 값이 있는데 틀리면 형식 오류다.
              coverage = data.get("coverage", "full")
              if coverage not in ("full", "partial"):
                  raise ValueError("coverage 가 full 또는 partial 이 아니다")
              unreviewed = data.get("unreviewed", [])
              if not isinstance(unreviewed, list) or not all(isinstance(u, str) for u in unreviewed):
                  raise ValueError("unreviewed 가 문자열 목록이 아니다")
              # full 이라는데 못 본 파일이 적혀 있으면 모순이다 — 못 본 쪽을 믿는다.
              partial = coverage == "partial" or bool(unreviewed)
              return findings, serious, unreviewed, partial, read_extra(data)


          status, lines = "pass", []
          serious_count, marker_findings, unreviewed_count = 0, [], 0
          risky, risky_reasons, risky_criteria = (False, [], [])
          if code == "0":
              risky, risky_reasons, risky_criteria = read_precheck()
          unavailable_next = (
              "다음: 이것은 이 PR 의 코드 문제가 아니라 AI 리뷰를 돌리지 못했다는 뜻입니다. "
              "저장소 소유자에게 알리고, 원인을 해결한 뒤 PR 의 ai-review 검사를 다시 실행하십시오."
          )
          if code == "4":
              # 새 줄에 비밀값 패턴이 보여 사전 판정이 리뷰를 막았다. 코멘트·표식에는 패턴 이름만 적는다(값은 어디에도 없다).
              status = "secret"
              names = read_secret_patterns()
              lines = [
                  "검사 불능 - 비밀값으로 보이는 문자열이 있어 AI 에 보내지 않음"
                  + (f"({', '.join(clean(n, 100) for n in names)})" if names else "")
                  + ". 승인자가 직접 확인해야 합니다.",
                  "",
                  "다음: Claude 가 추가된 비밀값을 코드에서 지우고 새 커밋을 올리면 AI 리뷰가 다시 돕니다. 이미 원격에 올라간 "
                  "키·토큰은 사람이 폐기하고 새로 발급해야 합니다. 비밀값이 아니라면 승인자가 변경을 직접 확인하십시오.",
              ]
          elif code == "3":
              status = "skip"
              _, reasons, _ = read_precheck()
              lines = ["AI 리뷰 건너뜀: " + ("; ".join(reasons) if reasons else "사유를 읽지 못함")]
          elif code != "0":
              status = "unavailable"
              if code == "":
                  lines = ["검사 불능: 사전 판정 전에 워크플로가 실패했습니다. job 로그를 확인하십시오."]
              else:
                  _, reasons, _ = read_precheck()
                  lines = [f"검사 불능: 사전 판정을 하지 못했습니다(종료코드 {code}). " + "; ".join(reasons)]
              lines.append(unavailable_next)
          elif token_missing != "false":
              status = "unavailable"
              lines = [
                  "검사 불능: CLAUDE_CODE_OAUTH_TOKEN 시크릿이 없습니다(포크 PR 에는 시크릿이 전달되지 않습니다).",
                  "다음: 사람이 할 일 - `claude setup-token` 으로 만든 토큰을 "
                  "`gh secret set CLAUDE_CODE_OAUTH_TOKEN -R <owner/repo>` 로 등록하고 ai-review 검사를 "
                  "다시 실행하십시오. AI 리뷰를 쓰지 않으려면 .github/risk-gate.yaml 의 ai_review 를 false 로 되돌리십시오.",
              ]
          elif install_outcome != "success":
              status = "unavailable"
              lines = [
                  f"검사 불능: Claude Code 설치 단계가 끝나지 못했습니다({install_outcome or '실행되지 않음'}). "
                  "job 로그를 확인하십시오.",
                  unavailable_next,
              ]
          elif claude_outcome != "success":
              status = "unavailable"
              reason = read_unavailable_reason()
              lines = [
                  f"검사 불능: Claude 리뷰 단계가 끝나지 못했습니다({claude_outcome or '실행되지 않음'}). "
                  + (f"사유: {clean(reason, 500)}." if reason else "시간 초과일 수 있으니 job 로그를 확인하십시오."),
                  unavailable_next,
              ]
          else:
              try:
                  findings, serious, unreviewed, partial, extra = parse_review()
              except ValueError as exc:
                  status = "unavailable"
                  lines = [f"검사 불능: {exc}.", unavailable_next]
              else:
                  serious_count = serious
                  unreviewed_count = len(unreviewed)
                  marker_findings = [
                      {"file": clean(i["file"], 200), "line": i["line"], "summary": clean(i["summary"], 200)}
                      for i in findings if i["severity"] == "serious"
                  ][:MARKER_FINDINGS]
                  if serious > 0:
                      status = "fail"
                      lines = [f"AI 리뷰가 심각한 지적 {serious}건을 냈습니다. 병합 전에 고쳐 주십시오.", ""]
                  elif partial:
                      status = "partial"
                      lines = ["AI 리뷰가 일부만 봤습니다. 심각한 지적은 없었지만 못 본 부분은 검사하지 못했습니다.", ""]
                  else:
                      lines = ["AI 리뷰에서 심각한 지적이 없습니다.", ""]
                  if partial:
                      shown = ", ".join(f"`{clean(u, 200)}`" for u in unreviewed[:UNREVIEWED_SHOWN])
                      if len(unreviewed) > UNREVIEWED_SHOWN:
                          shown += f" 외 {len(unreviewed) - UNREVIEWED_SHOWN}개"
                      lines.append(f"일부만 봄 - 못 본 파일 {len(unreviewed)}개: " + (shown or "목록을 받지 못함"))
                      # 사유를 나눠 적는다 — 묶음 상한을 넘어 돌리지 않은 것과 돌렸으나 실패한 것은 다음 할 일이 다르다.
                      cap = sum(1 for u in unreviewed if extra["reasons"].get(u) == "묶음 상한")
                      failed = sorted({extra["reasons"][u] for u in unreviewed
                                       if u in extra["reasons"] and extra["reasons"][u] != "묶음 상한"})
                      parts = []
                      if cap:
                          parts.append(f"묶음 상한을 넘어 돌리지 않음 {cap}개")
                      if failed:
                          parts.append(f"묶음 실패 {len(unreviewed) - cap}개 - " + "; ".join(clean(r, 150) for r in failed[:3]))
                      if parts:
                          lines.append("사유: " + ", ".join(parts))
                      lines.append("")
                  if extra["no_code"]:
                      lines.append("리뷰할 코드 파일이 없습니다. 바뀐 파일이 모두 AI 리뷰 대상이 아닙니다.")
                      lines.append("")
                  if extra["excluded"]:
                      ex = extra["excluded"]
                      sample = ", ".join(f"`{clean(e, 100)}`" for e in ex[:3])
                      lines.append(f"AI 리뷰 대상 아님 - 코드가 아닌 파일 {len(ex)}개(문서·이미지 등): " + sample
                                   + (f" 외 {len(ex) - 3}개" if len(ex) > 3 else ""))
                      lines.append("")
                  for item in findings:
                      mark = "심각" if item["severity"] == "serious" else "경미"
                      lines.append(f"- [{mark}] `{clean(item['file'], 200)}:{item['line']}` {clean(item['summary'])}")
                  if serious > 0:
                      lines += ["", "다음: Claude 가 지적을 고쳐 새 커밋을 올리면 AI 리뷰가 다시 돕니다."]
                  elif partial:
                      lines += ["", "다음: 승인자가 못 본 파일을 직접 확인하거나, 시간 초과 같은 일시 실패라면 ai-review 검사를 "
                                    "다시 실행하십시오. 이 검사는 일부만 본 채로 통과시키지 않습니다."]

          if risky:
              lines = ["위험 PR - 승인자 Approve 도 필요합니다: " + "; ".join(clean(r, 200) for r in risky_reasons), ""] + lines

          title = {
              "pass": "AI 리뷰 통과",
              "fail": "AI 리뷰 - 심각한 지적",
              "partial": "AI 리뷰 - 일부만 봄",
              "unavailable": "AI 리뷰 검사 불능",
              "skip": "AI 리뷰 건너뜀",
              "secret": "AI 리뷰 검사 불능 - 비밀값 의심",
          }[status]
          visible = "## ai-review\n\n**" + title + "**\n\n" + "\n".join(lines) + "\n"
          # risk-gate 가 읽는 숨은 표식. 같은 head sha 의 결과만 쓰인다. JSON 안 `-->` 는 HTML 주석을 닫으므로 이스케이프한다.
          marker = json.dumps(
              {"sha": head_sha, "status": status, "serious": serious_count, "findings": marker_findings,
               "unreviewed": unreviewed_count},
              ensure_ascii=True, separators=(", ", ": "),
          ).replace("-->", "--\\u003e")
          body = "<!-- ai-review -->\n" + visible + "\n<!-- ai-review-result " + marker + " -->\n"

          with open(os.path.join(temp, "ai-review-comment.md"), "w", encoding="utf-8") as f:
              f.write(body)
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as f:
                  f.write(visible)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"status={status}\n")
          print(body)
          PY

      # 취소된 run(새 커밋으로 concurrency 취소, job timeout)은 코멘트를 건드리지 않는다. `always()` 는 취소
      # 때도 이 단계를 돌려 낡은 run 의 "검사 불능" 이 새 run 의 코멘트를 덮어쓸 수 있어서 `!cancelled()` 를 쓴다.
      # 결과 정리·판정 단계는 파일과 종료코드만 다뤄 부작용이 없으므로 그대로 `always()` 다.
      - name: PR 코멘트 갱신
        if: ${{ !cancelled() && steps.result.outputs.status != '' }}
        uses: actions/github-script@v7
        env:
          STATUS: ${{ steps.result.outputs.status }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- ai-review -->';
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const body = fs.readFileSync(`${process.env.RUNNER_TEMP}/ai-review-comment.md`, 'utf8');

            // 코멘트가 100개를 넘을 수 있으므로 모두 읽는다. 누구나 마커를 흉내 내 코멘트를 쓸 수 있으니
            // risk-gate 가 표식을 읽는 조건(github-actions 봇이 쓴 것)과 같은 코멘트만 내 것으로 본다.
            const existing = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const mine = existing.find(c =>
              c.user && c.user.type === 'Bot' && c.user.login === 'github-actions[bot]' &&
              (c.body || '').includes(marker));
            // 건너뜀은 흔한 경우(꺼져 있는 저장소의 모든 PR)라 새 코멘트를 만들지 않는다. 이미 리뷰
            // 코멘트가 있으면(그 뒤 설정이 꺼진 경우) 그 코멘트만 건너뜀으로 고친다.
            if (process.env.STATUS === 'skip' && !mine) return;
            if (mine) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: 판정
        if: always()
        shell: bash
        env:
          STATUS: ${{ steps.result.outputs.status }}
        run: |
          case "$STATUS" in
            pass)
              echo "통과"
              ;;
            skip)
              echo "AI 리뷰 건너뜀(설정 없음 또는 ai_review 꺼짐, 사유는 job 요약에 있다)"
              ;;
            fail)
              echo "::error title=AI 리뷰 - 심각한 지적::AI 리뷰가 심각한 지적을 냈다. 내용은 PR 코멘트와 job 요약에 있다."
              exit 1
              ;;
            partial)
              echo "::error title=AI 리뷰 - 일부만 봄::AI 리뷰가 큰 변경 일부만 봤다. 못 본 파일은 PR 코멘트와 job 요약에 있다. 통과로 보지 않는다."
              exit 1
              ;;
            secret)
              echo "::error title=AI 리뷰 검사 불능 - 비밀값 의심::새로 추가된 줄에 비밀값으로 보이는 문자열이 있어 diff 를 AI 에 보내지 않았다. 통과로 보지 않는다. 승인자가 직접 확인한다."
              exit 1
              ;;
            *)
              echo "::error title=AI 리뷰 검사 불능::AI 리뷰를 돌리지 못했다. 이 PR 의 코드 문제가 아니다. 이유는 PR 코멘트와 job 요약에 있다. 통과로 보지 않는다."
              exit 1
              ;;
          esac
