name: checker

# 검사 엔진이 플러그인 밖에 있는 이유가 팀원 PC(Windows)와 Actions(Linux) 두 곳에서 같은
# 엔진이 돌아야 하기 때문이므로, 양쪽에서 같은 결과가 나오는지가 곧 이 저장소의 전제다.
# 한쪽에서만 돌리면 경로 구분자, 파일명 대소문자 구분, 줄바꿈, 한글 인코딩 차이를 놓친다.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          # version 검사(아래)가 base 와의 공통 조상을 찾으려면 PR 이력이 필요하다. 이력이 필요한
          # 것은 PR 때뿐이라 push 는 얕게 받는다. 0 을 문자열로 쓴다 — 식에서 숫자 0 은 거짓이라
          # `조건 && 0 || 1` 은 늘 1 이 된다.
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: 의존성 설치
        run: uv sync --all-extras --dev

      # 진짜 gitleaks 로 SAP 규칙·설정 이어받기·종료코드 구분을 확인하는 시험(9개)은 GITLEAKS_BIN 이
      # 없으면 건너뛴다(#662). 다른 워크플로와 같은 판을 공식 체크섬으로 고정해 받고, 다음 단계에 경로를 넘긴다.
      # 판을 올릴 때는 main-checks.yml·pr-checks.yml 의 GITLEAKS_VERSION·GITLEAKS_SHA256 과 함께 고친다.
      - name: gitleaks 받기
        shell: bash
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256_LINUX: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          GITLEAKS_SHA256_WINDOWS: d29144deff3a68aa93ced33dddf84b7fdc26070add4aa0f4513094c8332afc4e
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/gitleaks-bin"
          mkdir -p "$dir"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          if [ "$RUNNER_OS" = "Windows" ]; then
            pkg="gitleaks_${GITLEAKS_VERSION}_windows_x64.zip"
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/$pkg" "$base/$pkg"
            echo "${GITLEAKS_SHA256_WINDOWS}  $RUNNER_TEMP/$pkg" | sha256sum -c -
            unzip -q -o "$RUNNER_TEMP/$pkg" gitleaks.exe -d "$dir"
            # bash 로 도는 훅 시험이 역슬래시 경로를 잘못 읽지 않게 C:/… 꼴로 바꾼다.
            bin="$(cygpath -m "$dir/gitleaks.exe")"
          else
            pkg="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/$pkg" "$base/$pkg"
            echo "${GITLEAKS_SHA256_LINUX}  $RUNNER_TEMP/$pkg" | sha256sum -c -
            tar -xzf "$RUNNER_TEMP/$pkg" -C "$dir" gitleaks
            bin="$dir/gitleaks"
          fi
          "$bin" version
          echo "GITLEAKS_BIN=$bin" >> "$GITHUB_ENV"

      - name: 테스트
        run: uv run pytest -q

      - name: CLI 계약 확인 (통과는 0)
        shell: bash
        run: |
          uv run python checker/tests/make_fixtures.py
          F=checker/tests/fixtures/client-docs/sample
          uv run doc-guard --rules "$F/rules" "$F/docs/제안서/20260921_로그인_제안서.md"

      - name: CLI 계약 확인 (위반은 1)
        shell: bash
        run: |
          F=checker/tests/fixtures/client-docs/sample
          set +e
          uv run doc-guard --rules "$F/rules" "$F/docs/제안서/제안서최종.md" > /dev/null
          code=$?
          set -e
          test "$code" -eq 1 || { echo "종료코드가 1이 아니라 $code 다"; exit 1; }

      # 배포되는 파일(plugins/harness/, checker/ 의 엔진, pyproject.toml, uv.lock, scripts/, 재사용 워크플로)을 바꾼 PR 은 plugin.json version 을 올려야 한다
      # (CLAUDE.md 원칙 8, #136, #149 — 엔진은 version 태그로 배포된다).
      # git 과 파일 경로만 보는 검사라 OS 마다 돌릴 이유가 없어 ubuntu 에서만 한 번 돈다.
      - name: Plugin version 올림 확인
        if: github.event_name == 'pull_request' && matrix.os == 'ubuntu-latest'
        shell: bash
        run: uv run python scripts/check_plugin_version.py --base "${{ github.event.pull_request.base.sha }}"

      # 같은 version 으로 올린 열린 PR 이 또 있으면 이 PR 이 실패한다(#324, 경고에서 실패로 #470 — 경고는 초록이라
      # 병합됐다). 먼저 병합되는 쪽이 v{version} 태그를 가져가고 다른 쪽은 배포되지 못한다. 메시지가 올릴 다음 값을
      # 알려 준다. 열린 PR 목록을 못 읽으면 검사 불능(빨간 불)이고,
      # 다른 PR 한 건만 못 읽으면 그 PR 만 건너뛰며 경고한다(막지 않는다). 이 PR 이 version 을 안 올렸으면 네트워크를 쓰지 않는다. 이 저장소 전용 스텝이라 고객사 PR 검사엔 닿지 않는다.
      - name: 열린 PR 끼리 plugin version 겹침 확인
        if: github.event_name == 'pull_request' && matrix.os == 'ubuntu-latest'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run python scripts/check_plugin_version_overlap.py "${{ github.event.pull_request.number }}" "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.base.ref }}"
