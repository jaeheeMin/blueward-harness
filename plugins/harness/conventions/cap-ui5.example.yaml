# CAP·UI5 개발 표준 검사 설정 예시 — 프로젝트의 conventions/cap-ui5.yaml 로 복사해 쓴다.
#
# 이 이름으로 둔 파일이 있으면 하네스가 conventions/cap-ui5.md 의 규칙 중 기계로 판정되는 것을 검사한다.
#   - UI5 코드를 저장하기 직전 훅이, 그 저장으로 새로 생기거나 바뀌는 줄만 본다
#   - PR 은 추가·변경된 줄만 본다(이미 있던 줄의 위반은 막지 않는다)
# 파일이 없으면 검사하지 않는다. 있는데 못 읽으면(키 오타, 알 수 없는 규칙 id) 통과로 두지 않고 검사 불능으로 막는다.
# 내용을 비워 두면 아래 규칙이 모두 엔진 기본 심각도로 켜진다.
#
# 검사 대상 파일: **/webapp/**/*.js, *.view.xml, *.fragment.xml, **/i18n/*.properties
# (CAP srv/ 의 JS 와 abapGit 메타 .xml 은 대상이 아니다)
#
# 엔진 기본 규칙(violation 은 검사 실패, warn 은 알리기만):
#   UI5-001 violation  console.* 를 쓰지 않는다
#   UI5-002 violation  == / != 를 쓰지 않는다
#   UI5-003 violation  Control ID 에 하이픈을 쓰지 않는다
#   UI5-004 violation  화면 XML 속성에 한글을 직접 쓰지 않는다
#   UI5-101 warn       icon 속성은 sap-icon:// 로 쓴다
#   UI5-102 warn       자기 닫힘 /> 앞에 공백을 두지 않는다
#   UI5-103 warn       document.getElementById, querySelector 로 DOM 을 직접 찾지 않는다
#   UI5-104 warn       UI5 의 private(_ 로 시작하는) 멤버를 쓰지 않는다
#   UI5-105 warn       들여쓰기는 탭으로 한다(파일 안 기존 줄이 공백이면 그 방식을 따른다)
#   UI5-106 warn       지역변수 이름은 자료형 접두어(s o $ i m a d f b r fn v p)로 시작한다
#   UI5-108 warn       i18n 키는 [화면].[Type].[key] 형식
#   UI5-109 warn       i18n 문구 윗줄에 텍스트 종류 주석(#XBUT 등)
#   UI5-110 warn       i18n 한글 메시지를 ~세요. / ~주시오. 로 끝내지 않는다

# 규칙별 심각도를 바꾼다: violation | warn | off. 적지 않은 규칙은 엔진 기본값이다.
# 예) 고객사 표준이 들여쓰기를 공백으로 정했으면 UI5-105 를 끄고, 접두어 규칙을 막는 규칙으로 올린다.
#   규칙: {UI5-105: off, UI5-106: violation}
규칙: {}

# 검사하지 않을 파일 경로(저장소 루트 기준 glob, ** 는 하위 폴더 전부). 사람이 결정해서 넣고 이유를 주석으로 남긴다.
# 예) 도구가 만든 파일이라 고칠 수 없는 앱
#   - src/ui5/zppauto1010/**
예외: []

# UI5-108 이 키 형식을 보지 않는 키. 적으면 이 기본 목록을 대체한다(Fiori 가 쓰는 앱 정보 키).
i18n_제외_키: [appTitle, appDescription, flpTitle, flpSubtitle]
