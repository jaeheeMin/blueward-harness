# SRS 는 docs/ssot/ 에 하나만 두고 이름을 고정한다. 필수 절은
# templates/harness/SRS.md 의 `##` 제목에서 그대로 읽는다.
# req_cross_reference 는 요구사항 상세 절(`### REQ-n`)이 다른 REQ·DEV 번호를 말하면
# 그 절의 제목 아래에 `관계: 별개 — <이유>` 줄을 요구한다(한 개발이 REQ 둘로 쪼개지는 것을
# 막는다). 제외_패턴은 번호 바로 앞에 이 정규식이 붙으면 옛 번호 표기로 보고 건너뛴다.
# form_columns 는 요구사항 표의 열과 상세 절 `####` 소제목이 양식 지도(templates/forms/ 에서 원본이 SRS 인
# 지도)의 열 + md 전용 열(+ 엔진 기본 `다음 단계`) 밖이면 거절한다. 지도에 있는데 표에 없는 열은 허용한다.
# 지도가 없는 저장소는 SRS 틀(위 템플릿)의 열이 기준이고, 기본_소제목은 그때 상세 절에 허용할 소제목이다.
# 이 규칙 종류는 엔진 v0.10.75 이상에만 있다. 새로 scaffold 하는 저장소는 stable 태그가 v0.10.75 이상으로
# 옮겨 간 뒤에만 이 파일을 쓴다(그 전에 쓰면 모든 문서 유형이 검사 불능으로 멈춘다). 옛 stable 이면 이 항목을 빼고 시작한다.
템플릿: ../templates/harness/SRS.md
관할: "docs/ssot/**"
규칙:
  - 종류: filename
    패턴: '^SRS\.md$'
  - 종류: required_sections
  - 종류: req_cross_reference
    관계_접두어: "관계:"
    제외_패턴: ['옛\s*$']
  - 종류: form_columns
    원본: SRS
    기본_소제목: [설명, 완료 조건]
