# Spec 은 docs/spec/ 에 개발 건 하나당 파일 하나. 파일 이름은 DEV 번호로
# 시작한다. 필수 절은 templates/harness/spec.md 의 `##` 제목에서 그대로 읽는다.
# 캡처 그림(docs/spec/img/*.png)은 관할 밖이다 — 그림까지 잡으면 png 리더가 없어 검사 불능이
# 된다. `docs/spec/**/*.md` 로 쓰면 안 된다: 엔진 glob 에서 `**/` 는 폴더 한 단계 이상을 요구해
# docs/spec 바로 아래 md 를 못 잡는다. `*` 는 `/` 도 넘으므로 아래 모양이 맞다.
템플릿: ../templates/harness/spec.md
관할: "docs/spec/*.md"

규칙:
  - 종류: filename
    패턴: '^DEV-\d{3,}-.+\.md$'
  - 종류: required_sections
    # 사용 객체 절은 뒤에 생긴 절이라 없는 옛 Spec 도 통과해야 한다. 절을 쓴다면
    # 아래 md_table 이 표 형식을 본다.
    선택_섹션: [사용 객체, 권한, Launchpad 노출]
  # 이 규칙 종류는 엔진 배포 태그(v0.10.59 이상, stable)를 받게 된 뒤에 켠다.
  - 종류: md_table
    절: 사용 객체
    열: [종류, 이름, 작업, 비고]
    값:
      종류: [Domain, Data Element, Structure, Database Table, CDS View, Metadata Extension, Behavior Definition, Service Definition, Service Binding, ABAP Class, AMDP Class, CDS Table Function, Message Class, IAM App, Business Catalog, Launchpad App Descriptor Item, Authorization Field, Authorization Object, Access Control, Restriction Field, Restriction Type, Business Role Template]
      작업: [생성, 수정, 참조]
    패턴:
      이름: '(?:/[A-Za-z0-9_]+/)?[A-Za-z][A-Za-z0-9_]*'
  # 권한 표(#361). 데이터를 바꾸는 앱의 권한 검사 방식을 적게 한다. 검사 방식 허용 값은 RAP
  # "Authorization Definition"(authorization master global/instance, authorization : update/none)을
  # 옮긴 것이고, 활동(ACTVT)은 두 자리 숫자 형식만 본다(`-` 는 해당 없음). `검사 안 함` 이거나 검사 기준
  # 필드가 `-`/빈 칸이면 비고(이유·결정자·날짜)를 반드시 채우게 한다 — 내용이 맞는지는 승인자가 본다.
  # `조건_필수` 는 엔진 v0.10.85 이상에만 있다. stable 이 그 미만이면 이 항목을 빼고 쓴다(먼저 켜면
  # 모든 Spec 이 검사 불능으로 멈춘다).
  - 종류: md_table
    절: 권한
    열: [동작, 검사 방식, 권한 객체, 활동, 검사 기준 필드, 비고]
    값:
      검사 방식: [global, instance, "global, instance", update 위임, 검사 안 함]
    패턴:
      활동: '\d{2}(?:\s*,\s*\d{2})*|-'
    조건_필수:
      - 열: 비고
        조건:
          검사 방식: [검사 안 함]
      - 열: 비고
        조건:
          검사 기준 필드: ["", "-"]
  # Launchpad 노출 표. 시맨틱 오브젝트·액션은 SAP Help "Editing Launchpad App Descriptor Items"
  # 의 문자 규칙을 본다(전문 확인 2026-11-07, #751). 오브젝트: 문서는 "allowed: uppercase letters
  # [A-Z], lowercase letters [a-z], numbers [0-9]. The first character must be an uppercase or
  # lowercase letter" 지만 밑줄은 허용해 둔다 — public-cloud 의 실제 앱(DEV-003 ZMM_StockLedger,
  # DEV-008 배포 자동 생성 디스크립터의 ZPP_AUTO1_PRODUCT_STATUS)이 밑줄을 쓰고 열린다. 실제 값을
  # 거절하는 쪽이 더 나빠서 사용자 결정으로 넓게 둔다. 액션: "starting with lower case and without
  # blanks", 허용 문자 영문자·숫자·밑줄. 나머지 열은 형식을 정하지 않는다(칸이 전부 빈 자리표시 줄은 통과).
  - 종류: md_table
    절: Launchpad 노출
    열: [타일 제목, 부제, 아이콘, 시맨틱 오브젝트, 액션, 파라미터, 카탈로그, 배치]
    패턴:
      시맨틱 오브젝트: '[A-Za-z][A-Za-z0-9_]*'
      액션: '[a-z][A-Za-z0-9_]*'
  # Spec 의 `## 양식 항목` 이 양식 지도 밖의 양식·시트·칸·표·열을 쓰면 거절한다(#316). 절이 없는
  # Spec 은 통과한다. 엔진 v0.10.75 이상에만 있다 — stable 이 v0.10.75 이상일 때만 새 scaffold 로 쓰고,
  # 아니면 이 항목을 빼고 시작한다(먼저 켜면 모든 문서 유형이 검사 불능으로 멈춘다).
  - 종류: form_columns
    원본: 작업본
