# 교차 검사를 이 저장소에서 돌릴지 정한다. PR 에서 doc-guard 코멘트가 이 설정을 따른다.
#
#   번호_짝    SRS·Spec·원장의 개발 번호가 서로 맞는지 (docs/ssot/SRS.md, docs/spec/, audit/ledger/ 가 바뀐 PR)
#   객체_겹침  둘 이상의 Spec 이 같은 SAP 객체를 만들거나 고치는지 경고 (docs/spec/ 이 바뀐 PR, 경고만 하고 통과는 유지)
#   판_겹침    열린 PR 끼리 같은 문서 판 번호(산출 파일명의 _v0.3, SRS 버전)를 쓰는지 경고 (SRS 나 _v<판> 산출 파일을 바꾼 PR, 경고만 하고 통과는 유지)
#
# 끄려면 해당 줄을 false 로 바꾼다. 줄을 지우면 켜진 것으로 본다. true / false 말고 다른 값이나
# 모르는 키를 쓰면 검사 불능(종료코드 2)이 되고, 조용히 무시하지 않는다.
# 이 파일은 rules/ 의 하위 폴더에 둔다 — 최상위 *.yaml 은 문서 규칙 파일로 읽히기 때문이다.
번호_짝: true
객체_겹침: true
판_겹침: true
