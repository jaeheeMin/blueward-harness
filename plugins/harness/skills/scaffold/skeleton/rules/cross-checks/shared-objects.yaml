# 객체 겹침 경고(switches.yaml 의 객체_겹침)에서 뺄 "공용 객체 종류" 를 정한다.
#
# 공용 종류는 여러 개발이 함께 쓰는 객체라(예: 같은 Message Class 에 개발마다 번호를 더한다)
# 둘 이상의 Spec 이 만들거나 고쳐도 한 개발이 쪼개진 것이 아니다. 이 종류의 겹침은 경고하지
# 않고, PR 코멘트에 "공용 객체(종류) 겹침 n건은 경고하지 않았습니다" 로 개수만 남는다.
#
# - 이 파일이 없거나 공용_종류 줄이 없으면 기본값 ["Message Class"] 를 쓴다.
# - 공용_종류: [] 로 두면 제외하는 종류가 없다(모든 종류의 겹침을 경고한다).
# - 종류 이름은 Spec 의 `## 사용 객체` 표 "종류" 칸 값이다. 앞뒤 공백과 대소문자는 무시한다.
# - 문자열 목록이 아니거나 모르는 키가 있으면 검사 불능(종료코드 2)이다. 조용히 무시하지 않는다.
# - 이 파일은 rules/ 의 하위 폴더에 둔다 — 최상위 *.yaml 은 문서 규칙 파일로 읽히기 때문이다.
공용_종류:
  - Message Class
