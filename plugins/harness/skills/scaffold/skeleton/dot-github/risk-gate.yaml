# PR 위험도 기준이다(#102). 위험하다고 판정된 PR 은 승인자 목록의 사람 가운데 작성자가
# 아닌 사람이 PR 의 마지막 커밋에 Approve 해야 통과한다. 위험하지 않은 PR 은 승인 없이
# 병합할 수 있다.
#
# 이 파일은 PR 이 아니라 기준 브랜치(main)에서 읽는다. PR 이 자기 기준을 스스로 느슨하게
# 바꿀 수 없게 하기 위해서다. 그러므로 이 파일을 고치는 PR 도 .github/ 아래 변경이라 위험
# 경로로 판정되어 승인을 받아야 하고, 고친 기준은 병합된 뒤부터 적용된다.
# 이 파일을 지우면 위험도 게이트는 꺼진다(아무것도 막지 않는다).
# 알 수 없는 키나 잘못된 값이 있으면 판정 불능으로 빨간불이 된다(오타가 기준을 몰래 바꾸지 않게).

# 크기: 바뀐 줄(추가 + 삭제)이 이 값을 넘거나 바뀐 파일이 이 개수를 넘으면 위험하다.
max_changed_lines: 300
max_changed_files: 10

# 위험 경로: 이 접두어 아래 파일을 바꾸면 위험하다. 적어 둔 것에 더해
# .github/human-merge-paths 의 경로도 언제나 위험 경로로 본다.
high_risk_paths:
  - docs/ssot/
  - docs/spec/
  - rules/
  - templates/
  - conventions/
  - .github/
  - .claude/
  - CLAUDE.md

# 비밀값: 추가된 줄에 토큰·키·비밀번호·웹훅 주소 모양이 있으면 위험하다. 값은 어디에도
# 출력하지 않고 파일과 줄 번호만 알린다.
secret_scan: true

# 검사 통과: 이 PR 의 다른 검사가 실패했거나 아직 진행 중이면 위험하다.
require_checks_green: true

# AI 리뷰: 켜면 이름이 ai-review 인 검사의 결과를 읽는다(실패 = 심각한 지적, 일부만 봄, AI 리뷰 검사
# 불능·취소·시간 초과면 위험, 아직 없거나 진행 중이면 대기). 그 검사는 .github/workflows/ai-review.yml 이
# 만든다. 켜려면: (1) `claude setup-token` 으로 만든 토큰을 `gh secret set CLAUDE_CODE_OAUTH_TOKEN -R <owner/repo>`
# 로 등록 (2) 여기를 true 로. 위험한 PR 을 포함해 코드(`src/`)를 바꾼 PR 에 리뷰를 돌린다(위험한 PR 은 승인자 Approve 도 필요).
# 단 새 줄에 비밀값 패턴이 보이는 PR 은 diff 를 외부 AI 에 보내지 않으려고 리뷰를 돌리지 않고 검사 불능으로 실패한다.
ai_review: false

# AI 리뷰 대상 경로(#411): 이 접두어 아래 파일을 바꾼 PR 만 AI 리뷰 대상이다. 문서·Spec 만 바꾼 PR 은 `ai-review`
# 검사가 아예 뜨지 않으므로(호출 워크플로 ai-review.yml 의 `paths: ['src/**']`), 결과를 기다리며 영원히 대기하지 않고
# "대상 아님" 으로 통과시킨다. 접두어 매칭은 `high_risk_paths` 와 같다 — `src/` 는 `src/**` 와 같은 뜻이다.
# 호출 워크플로의 paths 와 맞춰 둔다. `[]` 로 두면 모든 PR 이 대상이다(호출 워크플로의 paths 도 지울 때).
ai_review_paths:
  - src/

# 크기를 세지 않는 경로(#534): 이 접두어 아래 파일은 위 max_changed_* 판정의 줄·파일 수 합계에서 뺀다. src/ 는
# 080 에서 이미 활성화된 코드의 사본이고 audit/ 은 기록이라 사람이 크기로 막을 것이 적다. 그래서 개발 PR 이 Spec 한
# 줄을 같이 고쳐도 src/ 줄이 승인 사유가 되지 않는다. 남은 파일만으로 기준을 판정해 넘으면 승인 사유이고, 뺀 것까지
# 합쳐야 넘는 부분은 PR 코멘트의 "참고(승인 필요 없음)" 로만 낸다. 비밀값·위험 경로·AI 리뷰 등 다른 기준은 그대로다.
# `[]` 로 두면 모든 파일을 센다. 아래 size_warn_only_paths 와 함께 쓰면 이 키가 먼저 적용된다.
size_exclude_paths:
  - src/
  - audit/

# 크기 경고만 하는 경로(#436): 바뀐 파일이 모두 이 접두어 아래인 PR 은 크기 기준(위 max_changed_*)을 넘어도
# 승인을 요구하지 않고 PR 코멘트에 "참고(승인 필요 없음)" 경고만 남긴다. 소스(src/)만 바꾼 PR 은 크기 기준을 넘어도
# 승인 대신 경고만 낸다. src/ 는 080 에서 이미 활성화된 코드의 스냅샷이라 승인으로 막을 것이 적다. 비밀값·CR-009·
# AI 리뷰·다른 검사 실패는 그대로 승인 사유다. 하나라도 이 밖의 파일(Spec·운영 파일 등)을 바꾸면 크기도 지금처럼
# 승인 사유다. `[]` 로 두면 모든 PR 이 크기 기준을 승인 사유로 쓴다.
size_warn_only_paths:
  - src/

# SRS 쪼개짐 의심: SRS 에 새 요구사항(REQ)이 생겼고 기존 요구사항을 넓힌 것처럼 보이면(새 REQ 상세 절이
# 다른 REQ·DEV 번호를 말함, 범위 "하지 않는 것" 줄이 지워지거나 바뀜, 새 제목이 기존 제목과 겹침) 위험
# 사유와 PR 코멘트에 근거를 붙인다. 막는 기준이 아니라 승인자가 확인하게 하는 표시다. SRS diff 가 너무
# 커서 못 읽으면 검사 불능 사유로 낸다. 끄려면 false.
# 이 키는 엔진 배포 태그에 들어간 뒤에만 유효하다(그 전에 적으면 모르는 키 설정 오류). 안 적어도 기본 켬.
srs_split_hint: true

# 승인자 목록 파일. 한 줄에 GitHub 아이디 하나. 작성자를 뺀 승인자가 한 명도 없으면 위험한
# PR 을 승인으로 통과시킬 수 없으니 작성자가 아닌 사람을 반드시 한 명 이상 적는다.
approvers_file: .github/ssot-approvers
