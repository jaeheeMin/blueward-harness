# 코드(`src/`)를 바꾼 PR 에 Claude AI 리뷰를 돌리는 호출 워크플로다(위험한 PR 포함, #125, #360, #411). 심각한 지적이 나오거나
# 큰 PR 을 일부만 보면 이 검사가 실패하고, risk-gate 의 `ai_review` 기준이 그 결과를 읽어 "승인 필요" 로 판정한다.
# 판정·리뷰 로직은 blueward-harness 저장소에 있다 — risk-gate.yml 과 같은 사정이다.
#
# **기본은 꺼짐이다.** `.github/risk-gate.yaml` 의 `ai_review` 가 false 이면 이 워크플로는 리뷰 없이
# 건너뛰고 성공으로 끝난다. 켜려면:
#   (1) `claude setup-token` 으로 만든 토큰을 `gh secret set CLAUDE_CODE_OAUTH_TOKEN -R <owner/repo>` 로 등록
#   (2) `.github/risk-gate.yaml` 의 `ai_review` 를 true 로 바꾼다
# 켰는데 시크릿이 없으면 통과시키지 않고 "검사 불능" 으로 실패한다. 포크 PR 에는 시크릿이 전달되지 않는다.
# 새 줄에 비밀값 패턴이 보이는 PR 은 diff 를 외부 AI 에 보내지 않으려고 리뷰를 돌리지 않고 "검사 불능 - 비밀값 의심"
# 으로 실패한다(승인자가 직접 확인). 변경이 너무 커서 비밀값 검사를 못 한 PR 은 계속 리뷰한다.
#
# `paths: ['src/**']` 라서 문서·Spec 만 바꾼 PR 은 이 워크플로가 뜨지 않는다(#411). 뜨지 않은 PR 이 risk-gate 에서
# 영원히 "AI 리뷰 결과 없음" 대기가 되지 않도록 `.github/risk-gate.yaml` 의 `ai_review_paths` 가 같은 범위를 말한다
# (`src/` 와 `src/**` 는 같은 뜻). 코드 폴더를 바꾸려면 이 paths 와 `ai_review_paths` 를 함께 고친다.
#
# job id 는 반드시 `ai-review` 로 둔다. risk-gate 가 이 이름의 check run 의 결론을 읽는다
# (바꾸면 AI 리뷰 결과를 못 찾고 계속 대기로 본다).
name: ai-review
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: ['src/**']

jobs:
  ai-review:
    uses: jaeheeMin/blueward-harness/.github/workflows/ai-review.yml@stable
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
