# main 에 PR 이 병합되면, 그 PR 이 대표 `[DEV-xxx]` 이슈를 Closes 했는데 진행 원장(audit/ledger)의
# 해당 개발 건이 `완료` 가 아닌지 본다(#346, #445). 파일은 쓰지 않는다 — 원장 `완료` 는 /harness:deliver 가
# 그 PR 에 처음부터 담는다. 완료가 아니면 이슈가 열린다. 판정 로직은 blueward-harness 저장소에서
# 그때그때 내려받아 쓴다 — doc-guard.yml 과 같은 사정이다.
name: ledger-complete
on:
  push:
    branches: [main]
jobs:
  ledger-complete:
    uses: jaeheeMin/blueward-harness/.github/workflows/ledger-complete.yml@stable
    permissions:
      contents: read   # 읽기만 한다(main 에 push 하지 않는다)
      pull-requests: read
      issues: write   # 완료가 아니거나 판정을 못 했을 때 손으로 고쳐 달라는 이슈를 연다
