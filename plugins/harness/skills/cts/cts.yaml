# CTS 관리대장 작업본(md)은 docs/CTS관리대장/ 에 종류(Configuration·CBO)마다 파일 하나. 파일 이름은
# CTS관리대장_<종류>.md 이다(산출 xlsx 의 이름에서 `_v{버전}` 을 뺀 것). 필수 절은 templates/harness/cts.md 의 `##` 제목에서
# 그대로 읽는다. 버전은 머리(첫 `##` 앞)의 `버전: 0.1` 줄이고 산출 파일명의 버전이 된다.
# form_columns 는 `## 양식 항목` 의 시트·표·열이 양식 지도(templates/forms/ 의 CTS 관리대장 지도) 밖이면 거절한다.
# 산출된 xlsx 는 이 관할이 아니다(.md 만) — 파일명 패턴은 cts-output.yaml 이 본다.
# 이 파일은 Project Repository 의 rules/cts.yaml 로 복사해 쓴다(/harness:cts 가 안내한다).
템플릿: ../templates/harness/cts.md
관할: "docs/CTS관리대장/*.md"

규칙:
  - 종류: filename
    패턴: '^CTS관리대장_(Configuration|CBO)\.md$'
  - 종류: required_sections
  - 종류: form_columns
    원본: 작업본
    # 파일 이름의 종류와 다른 양식 소절(예: Configuration 작업본 안의 CTS_관리대장_CBO)은 산출에서 조용히 빠지므로 막는다(#577)
    파일명_양식:
      패턴: '^CTS관리대장_(?P<종류>.+)\.md$'
      양식: 'CTS_관리대장_{종류}'
