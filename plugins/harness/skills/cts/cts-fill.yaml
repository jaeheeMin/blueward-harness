# 트랜스포트에서 CTS 관리대장 작업본 요청 표를 채우는 매핑(이슈 #563). `python -P -m checker.cts_fill` 이 읽는다.
# 엔진에는 양식 글자가 없다 — 어느 트랜스포트 값이 어느 열로 가는지, 어느 작업본으로 가는지는 이 파일이 정한다.
# 이 파일은 Project Repository 의 templates/harness/cts-fill.yaml 로 복사해 쓴다(/harness:cts 가 안내한다).
# 열 이름은 양식 지도(templates/forms/CTS_관리대장_*.yaml)의 `열` 키와 같아야 한다(오타 '모둘' 도 지도 그대로).
# 트랜스포트에서 알 수 없는 칸(오픈단계·모둘·주요변경 및 특이사항·Client 종속여부·Target Client·처리 칸)은 여기 적지 않는다 — 비워 둔다.

# 작업본 파일 이름(rules/cts.yaml 의 filename 패턴과 같다). 이름 그룹 `kind` 가 아래 `작업본` 종류다.
작업본_파일명: '^CTS관리대장_(?P<kind>.+)\.md$'

# 트랜스포트 JSON 의 category → 채울 작업본 종류(docs/CTS관리대장/CTS관리대장_<작업본>.md)
종류:
  customizing:        # 커스터마이징 요청(ADT 의 customizing 목록)
    작업본: Configuration
  workbench:          # 워크벤치 요청(개발 오브젝트)
    작업본: CBO

# 트랜스포트 JSON 의 키 → 작업본 열 이름. `row_no` 는 새 행의 번호를 매기는 열이다(표의 마지막 숫자 + 1).
# YAML 은 따옴표 없는 NO·no 를 false 로 읽으므로 "NO" 는 반드시 따옴표로 쓴다.
열:
  row_no: "NO"
  number: Request NO
  description: Description
  owner: 요청자
  date: 요청일
  target: Target System

# 요청일 칸에 무엇을 쓸지. ADT 응답에는 요청을 만든 날짜가 없다(080 실측 2026-11-03). `없음` 이면 요청일을 비워 두고 사람이 적는다.
# `lastchanged` 는 응답의 마지막 변경 시각(tm:lastchanged_timestamp)의 날짜를 쓴다 — 만든 날짜와 다를 수 있으니 고객사와 정한 뒤에만 켠다.
요청일_출처: 없음

# 열 값이 category 로 정해지는 칸. 양식 머리글 메모의 "IMG/PGM" 에 맞춘 값이니 고객사가 다르게 쓰면 여기를 고친다.
값:
  CTS 유형:
    customizing: IMG
    workbench: PGM
