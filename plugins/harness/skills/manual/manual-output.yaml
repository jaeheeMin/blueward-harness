# 사용자 매뉴얼 pptx 산출물의 파일 이름 규칙. 양식 지도(templates/forms/*.yaml)의 `검사_규칙` 이 이 파일을 가리키고,
# 산출(checker.export)이 첫 filename 패턴을 읽어 산출 파일명을 대조한다. PR 검사도 같은 패턴을 본다.
# 파일 이름의 모양은 양식 지도의 `산출.파일명` 에서 정해진다 — 양식이 바뀌어 파일명 모양이 바뀌면 이 패턴도 같이 고친다.
# 이 파일은 Project Repository 의 rules/manual-output.yaml 로 복사해 쓴다(/harness:manual 이 안내한다).
관할: "docs/manual/**/*.pptx"

규칙:
  - 종류: filename
    패턴: '^.+_v\d+\.\d+\.pptx$'
