# 사용자 매뉴얼 작업본(md)은 docs/manual/<LoB>/ 에 업무 제목별로 파일 하나. 파일 이름은
# <번호>.<업무 제목>.md 이다. 필수 절은 templates/harness/manual.md 의 `##` 제목에서 그대로 읽는다.
# form_columns 는 `## 양식 항목` 의 쪽·칸·`####` 소제목이 양식 지도(templates/forms/ 의 pptx 지도) 밖이면 거절한다.
# 산출된 pptx 는 이 관할이 아니다(.md 만) — 파일명 패턴은 manual-output.yaml 이 본다.
# 이 파일은 Project Repository 의 rules/manual.yaml 로 복사해 쓴다(/harness:manual 이 안내한다).
템플릿: ../templates/harness/manual.md
관할: "docs/manual/**/*.md"

규칙:
  - 종류: filename
    패턴: '^\d+\..+\.md$'
  - 종류: required_sections
  # 어떤 개발 건(DEV)을 묶었는지 적는 표. 절이 없거나 DEV 칸 형식이 틀리면 거절한다.
  - 종류: md_table
    절: 묶은 개발 건
    열: [DEV, 제목]
    필수: true
    패턴:
      DEV: 'DEV-\d{3,}'
  - 종류: form_columns
    원본: 작업본
