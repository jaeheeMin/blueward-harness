# 단위테스트 List 작업본(md)은 docs/unittest/ 에 LoB 마다 파일 하나. 파일 이름은 <LoB>.md 이다(산출 xlsx
# BW_단위테스트 List_<LoB>_v{버전}.xlsx 의 이름에 들어가므로 파일 이름에 쓸 수 없는 문자 `\ / : * ? " < > |` 는 막는다).
# 필수 절은 templates/harness/unittest.md 의 `##` 제목에서 그대로 읽는다. 버전·LoB 는 머리(첫 `##` 앞)의
# `버전: 0.1`·`LoB: Production` 줄이고 산출 파일명이 된다.
# form_columns 는 `## 양식 항목` 의 시트·표·열이 양식 지도(templates/forms/단위테스트 List.yaml) 밖이면 거절하고,
# Test Case 소절(`### 단위테스트 List · TC.견본 · <ID>`)의 ID 가 `<모듈>.<NN>.<NN>.<NN>`(Task Variant 레벨이면 한 자리 더)
# 형식이 아니어도 거절한다(ID_패턴. 시트 이름 규칙은 엔진이 따로 본다).
# 산출된 xlsx 는 이 관할이 아니다(.md 만) — 파일명 패턴은 unittest-output.yaml 이 본다.
# 이 파일은 Project Repository 의 rules/unittest.yaml 로 복사해 쓴다(/harness:unittest 가 안내한다).
템플릿: ../templates/harness/unittest.md
관할: "docs/unittest/*.md"

규칙:
  - 종류: filename
    패턴: '^[^\\/:*?"<>|]+\.md$'
  - 종류: required_sections
  - 종류: form_columns
    원본: 작업본
    # 다른 양식의 소절이 있으면 산출에서 조용히 빠지므로 막는다(#577)
    파일명_양식:
      패턴: '^.+\.md$'
      양식: '단위테스트 List'
    ID_패턴: '^[A-Z]{2,3}(\.\d{2}){3,4}$'
