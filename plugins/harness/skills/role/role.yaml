# User Role Mapping 작업본(md)은 docs/권한관리/ 에 파일 하나. 파일 이름은 사용자권한관리_User_Role Mapping.md 이다
# (산출 xlsx 의 이름에서 `_v{버전}` 을 뺀 것). 필수 절은 templates/harness/role.md 의 `##` 제목에서 그대로 읽는다.
# 버전은 머리(첫 `##` 앞)의 `버전: 0.1` 줄이고 산출 파일명의 버전이 된다.
# form_columns 는 `## 양식 항목` 의 시트·표·열이 양식 지도(templates/forms/사용자권한관리.yaml) 밖이면 거절하고,
# 메뉴 배정 표의 Role 열에 Role 개요 표에 없는 Role 이 있어도 거절한다(산출도 같은 이유로 멈춘다).
# 산출된 xlsx 는 이 관할이 아니다(.md 만) — 파일명 패턴은 role-output.yaml 이 본다.
# 이 파일은 Project Repository 의 rules/role.yaml 로 복사해 쓴다(/harness:role 이 안내한다).
템플릿: ../templates/harness/role.md
관할: "docs/권한관리/*.md"

규칙:
  - 종류: filename
    패턴: '^사용자권한관리_User_Role Mapping\.md$'
  - 종류: required_sections
  - 종류: form_columns
    원본: 작업본
    파일명_양식:
      패턴: '^(?P<양식>사용자권한관리)_User_Role Mapping\.md$'
      양식: '{양식}'
